name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  # Non-production, so the staging send guard (F03) refuses every outbound transport.
  TEST_DATABASE_URL: postgres://berelax:berelax@127.0.0.1:5432/berelax_test
  DATABASE_URL: postgres://berelax:berelax@127.0.0.1:5432/berelax_test

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berelax
          POSTGRES_PASSWORD: berelax
          POSTGRES_DB: berelax_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U berelax -d berelax_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # packages/pdf renders documents in headless Chromium so Arabic shaping and bidirectional
      # layout are done by an engine that gets them right (docs/adr/0011). The browser is a build
      # dependency of the integration suite, not an optional extra.
      - name: Install Chromium for PDF rendering
        run: pnpm exec playwright install --with-deps chromium

      # Ordered cheapest-first so a trivial mistake fails in seconds, not minutes.
      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Module boundaries
        run: pnpm boundaries

      - name: Module boundaries actually reject violations
        run: pnpm boundaries:test

      - name: Core purity gate
        run: pnpm purity

      - name: No invisible or bidi-reordering characters in source
        run: pnpm invisibles

      - name: Palette contrast gate
        run: pnpm palette

      - name: Generated token stylesheets are current
        run: pnpm tokens

      - name: Colour token discipline
        run: pnpm colours

      - name: Every locked decision has an ADR
        run: pnpm adr

      - name: Progress ledger matches the manifest
        run: pnpm progress:check

      - name: Fixture salon unchanged
        run: pnpm fixtures

      # The critique pass reads the rendered DOM against docs/08. It catches what a pixel diff
      # cannot: a defect present since the first commit, when there is no baseline to diff against.
      - name: Design self-critique
        run: pnpm critique

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (real PostgreSQL)
        run: pnpm test:integration

      - name: Migration dry run
        run: pnpm db:migrate:dry

      - name: Schema drift (Drizzle vs database)
        run: pnpm db:drift

      - name: Schema conventions (timestamptz, integer money)
        run: pnpm db:conventions

      - name: Gates fire
        run: pnpm gates:test
