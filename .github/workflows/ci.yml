name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  # Non-production, so the staging send guard (F03) refuses every outbound transport.
  TEST_DATABASE_URL: postgres://berelax:berelax@127.0.0.1:5432/berelax_test
  DATABASE_URL: postgres://berelax:berelax@127.0.0.1:5432/berelax_test

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berelax
          POSTGRES_PASSWORD: berelax
          POSTGRES_DB: berelax_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U berelax -d berelax_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # packages/pdf renders documents in headless Chromium so Arabic shaping and bidirectional
      # layout are done by an engine that gets them right (docs/adr/0011). The browser is a build
      # dependency of the integration suite, not an optional extra.
      - name: Install Chromium for PDF rendering
        run: pnpm exec playwright install --with-deps chromium

      # Ordered cheapest-first so a trivial mistake fails in seconds, not minutes.
      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Module boundaries
        run: pnpm boundaries

      - name: Module boundaries actually reject violations
        run: pnpm boundaries:test

      - name: Core purity gate
        run: pnpm purity

      - name: No invisible or bidi-reordering characters in source
        run: pnpm invisibles

      # Four supply-chain gates (H-HARD-02). All four are offline by construction, because `pnpm verify`
      # runs on every unit by every agent and a gate that needs the network is a gate that gets skipped.
      - name: No credentials in the repository
        run: pnpm secrets

      # H-HARD-03's half: every secret the system holds is declared with a rotation procedure, and a
      # new one added to the code without one fails here rather than being discovered during an
      # incident, when nobody knows how to rotate it.
      - name: Secret rotation inventory
        run: pnpm rotation

      # P-HR-01. A different question from the two above, and the difference is that an Emirates ID
      # cannot be rotated: a committed identity number is permanent, so the control has to run before
      # it lands. Refuses an IBAN or an Emirates ID that passes its own check digit anywhere in the
      # repository, and permits one that fails it - which is the rule a fixture follows.
      - name: Staff PII scan
        run: pnpm pii

      - name: Dependency advisories (offline snapshot)
        run: pnpm deps

      - name: Outbound licence policy
        run: pnpm licences

      - name: Container and image policy
        run: pnpm container

      # The online half of dependency scanning, and the only step in this workflow that reaches the
      # network for a check. It stays out of `pnpm verify` deliberately: a developer offline, or an agent
      # behind a proxy, must still be able to run the whole gate list. When this reports something the
      # snapshot does not have, the finding is written into build/advisories.json and either fixed or
      # accepted there with a dated expiry.
      - name: Dependency advisories (live database)
        run: pnpm audit:online

      - name: Palette contrast gate
        run: pnpm palette

      - name: Generated token stylesheets are current
        run: pnpm tokens

      - name: Colour token discipline
        run: pnpm colours

      # Every cron this system runs is one array a person can read, and a malformed expression is
      # accepted by pg-boss and then never fires.
      - name: Job registry and cron declarations
        run: pnpm jobs

      # Price, duration, bookability and VAT live in the catalogue and nowhere else. A `price` field on a
      # CMS collection is a second place the number can be wrong, and the one that is wrong is the one
      # nobody reconciles.
      - name: Catalogue/CMS boundary
        run: pnpm cms

      # The Google refresh token is a durable bearer credential for control of the business's Google
      # presence, and the scope it carries has no read-only variant. Three rules dependency-cruiser
      # cannot express: a sealed column named outside the token modules, an accessor identifier, and a
      # token interpolated into a template literal.
      - name: Google token chokepoint
        run: pnpm chokepoint

      # Every outbound message goes through sendMessage(), and the claim needs something that FAILS when a
      # second path exists. Four rules no type and no import rule can express: a `.send({...})` on a
      # transport outside the choke point, a gate evaluator with the answer written in
      # (`hasConsent: () => true`), a second caller of evaluateGate, and the ORDER inside send.ts - the
      # gate must run before the staging guard, or a refusal is recorded as a divert on staging.
      - name: Messaging send choke point
        run: pnpm send-chokepoint

      # One place every private document goes through. Five rules no type and no import rule can express: a
      # second `insert into private_document` (a document with no audit row), a second
      # `insert into private_document_fetch` (a fetch nobody recorded), a production caller of
      # writeTaxDocumentPdf (a statutory document on a caller-chosen path, which is the hole W-SYS-14 closes),
      # a second verifier of a signature, and the class catalogue disagreeing with migration 0101.
      - name: Private document choke point
        run: pnpm private-documents

      # No primary account number can reach this build. Seven rules no type, no test and no import rule can
      # express, because the claim is an ABSENCE: a `cc-` autocomplete token or a card-named field in anything
      # this build renders (which changes the PCI scope from SAQ-A to SAQ-A-EP in a line of markup), a payments
      # transport that reads a body without going through the one card-data boundary, a checkout contract field
      # named after card data, a second definition of what a card number looks like, a payments sink write that
      # skips the redactor, a second content-security-policy builder, and a hard-coded gateway origin.
      - name: SAQ-A card data
        run: pnpm saq-a

      # Nothing but an opaque category code leaves the building. Seven rules no type and no import rule can
      # express: a cast that forges the branded payload, the projection turning into a spread, a category code
      # spelled at a call site, a service-name column reaching the guard, the guard reaching the network, an
      # analytics destination host outside the declared adapters, and a funnel stage copied rather than
      # derived.
      - name: Egress guard
        run: pnpm egress

      # Every event declared on an element is an event the taxonomy holds, with the payload its own Zod
      # schema requires. A-FIRST-06's collector reads tracking off `data-berelax-event`, which exists so
      # that what the site collects is a set of strings a check can read without running anything — six
      # rules, each with a known-bad fixture, because a mistyped attribute renders fine, works fine, and is
      # refused at /api/collect weeks later as a funnel stage that has been empty long enough to look real.
      - name: Declared event attributes
        run: pnpm event-attributes

      # A tax document prints stored figures and derives none of them, declares only the Arabic weights
      # the PDF actually embeds, and builds right-to-left from the dir attribute rather than from a
      # direction mark. Three rules a review does not reliably catch on a template.
      - name: Tax document rules
        run: pnpm documents

      # An issued document is never edited, voided or deleted: a correction is a credit note (docs/04 SS4).
      # Two scans no per-module test can do — the export surface of every money module read from SOURCE, so
      # a module nothing imports is still covered, and `update invoice` / `delete from credit_note` anywhere
      # in the tree, which is otherwise refused at run time by a trigger rather than by the build.
      - name: No invoice mutation
        run: pnpm no-invoice-mutation

      # There is no way to file a tax return from this codebase, and the absence is a claim about what the
      # build CANNOT do — so it needs a check that fails on the day the ability appears (ADR 0052). Four
      # scans: the identifier anywhere in the tree, the network-capable GLOBALS over the tax estate (which
      # dependency-cruiser cannot see at all), the export reading no credentials, and the boundary rule
      # still covering every module this one names.
      - name: No auto-file capability
        run: pnpm no-autofile

      # Every JSON-LD block this site serves is built by one function, and an invalid graph fails the build
      # rather than warning. The rules a review does not catch: a plausible coordinate nothing stands behind,
      # an aggregateRating with no reviews, a Service with no price, and an OpeningHoursSpecification that
      # crosses midnight in one entry — which makes every consumer conclude the premises is never open.
      - name: Structured data (JSON-LD) validity
        run: pnpm structured-data

      # The editorial grid, the direction multiplier and the one shadow. Static rules, so they run with
      # the other cheap scans rather than after the browser work.
      - name: Layout, motion and elevation discipline
        run: pnpm layout

      - name: Every locked decision has an ADR
        run: pnpm adr

      - name: Progress ledger matches the manifest
        run: pnpm progress:check

      - name: Media library matches its manifest
        run: pnpm media

      - name: Fixture salon unchanged
        run: pnpm fixtures

      # The metric-matched font fallbacks are measured in Chromium and committed. A face changed
      # without regenerating them reflows every line on swap, which is the CLS this gate exists to stop.
      - name: Font fallback metrics current
        run: pnpm fonts

      # The critique pass reads the rendered DOM against docs/08. It catches what a pixel diff
      # cannot: a defect present since the first commit, when there is no baseline to diff against.
      - name: Design self-critique
        run: pnpm critique

      - name: Accessibility (axe, WCAG 2.1/2.2 AA)
        run: pnpm a11y

      # docs/08 §4's two numbers nobody checks: 48px on a phone, 40px on a desk, 8px between targets.
      # A mis-tap is not visible in code review and is the whole booking flow on a phone.
      - name: Touch targets
        run: pnpm touch-targets

      - name: Unit tests and coverage thresholds
        run: pnpm coverage

      # The integration suite needs a MIGRATED database, and nothing here was giving it one: the service
      # container creates `berelax_test` empty, and `pnpm db:migrate:dry` below runs afterwards into a
      # throwaway database it then drops. Every integration file would have failed on an empty schema.
      # Nobody saw it because every local run applies the migrations by hand first, as the agent brief says.
      #
      # It runs BEFORE the build, and since W-SITE-05 that order is load-bearing rather than tidy: the three
      # catalogue-derived routes prerender through `generateStaticParams` **over the catalogue**, so
      # `next build` reads the database. With the old order — build, then migrate — the build read an empty
      # schema and the eight most valuable pages on the site were prerendered as nothing at all.
      - name: Apply migrations to the test database
        run: pnpm db:apply

      # And SEEDED, for the same reason: the migrations create the schema and `pnpm seed` writes the
      # catalogue (0017 inserts the 8 services deliberately without their 32 prices, because prices are
      # business data a migration cannot re-run). `generateStaticParams` returns one path per *published*
      # service, so without this the build produces a treatments index with an empty menu and no treatment
      # pages, and every assertion about the 8 routes fails after the build rather than during it.
      - name: Seed the catalogue and the premises row
        run: pnpm seed

      # The integration suite drives the *built* application: shell.itest.ts, kitchen-sink.itest.ts,
      # treatments.itest.ts and content.itest.ts all spawn `next start`, which needs a build to start at all.
      # Without this step those files fail in CI on a missing `.next` while passing for anybody who had built
      # locally.
      #
      # W-SITE-07's five CMS routes prerender here too, and they add no new dependency to this step: they read
      # the premises row and the catalogue, which the two steps above provide, and their CMS read is fail-soft
      # by design — Payload's tables are created by drizzle-kit `push`, which is off under NODE_ENV=production,
      # so the `payload` schema is deliberately NOT a build dependency and an absent one renders the pages'
      # stated empty state. `apps/web/src/cms/read.ts` is where that is worked out.
      - name: Build the web application
        run: pnpm --filter @berelax/web build

      - name: Integration tests (real PostgreSQL)
        run: pnpm test:integration

      # The seven money invariants, run as a NAMED SET rather than reached through a glob. The claims
      # are `MONEY_INVARIANTS` in `vitest.integration.config.ts` and the step refuses three things: a
      # registered test that is no longer on disk or no longer carries its marker clause, a runner that
      # exits non-zero, and — the one neither of those can catch — an invariant for which zero PASSED
      # tests matched, which is what a skipped claim looks like. Without it, deleting or skipping one of
      # the seven made the run one test shorter out of about 7,600 and nothing said which claim had
      # gone. ADR 0074.
      #
      # It runs AFTER `pnpm db:apply` and `pnpm seed`, and that order is load-bearing: six of the nine
      # registered files are integration tests, which do not skip when the database is absent — they
      # fail, and that failure reads as a money invariant that is false. `scripts/test-gates.mjs` case
      # 152v asserts the order and 152w is its control.
      - name: The seven money invariants are examined and hold
        run: pnpm money-invariants

      - name: Migration dry run
        run: pnpm db:migrate:dry

      - name: Schema drift (Drizzle vs database)
        run: pnpm db:drift

      - name: Schema conventions (timestamptz, integer money)
        run: pnpm db:conventions

      # One private SQLSTATE, one rule. Derived from the migrations, so a code two units both took fails
      # here rather than at the merge where one of them has already shipped a translator matching it.
      - name: Private SQLSTATE registry
        run: pnpm sqlstate

      - name: Byte budgets
        run: pnpm budgets

      # Before the gate suite, not after: if a gate is missing from this workflow, saying so is cheaper than
      # discovering it 40 minutes later, and the check itself is a single file read.
      - name: Every verify gate is registered
        run: pnpm gate-registry

      - name: Gates fire
        run: pnpm gates:test

  # The half of container scanning that needs an image, which is why it is a job of its own and not a step
  # in `verify`. H-HARD-02 deferred it to W-SYS-06 because there was no Dockerfile to scan; there is one
  # now, it needs ffmpeg, and `build/container-policy.json` records the scan as enabled — a status this
  # workflow has to earn: the container policy gate fails with `[image-scan-not-wired]` if this job or either
  # of its two steps is removed, so deleting the scan is a build failure rather than a silent loss of
  # coverage.
  #
  # The gate's name is deliberately not written out here. `scripts/test-gates.mjs` proves that deleting a
  # `run:` step for one of the four supply-chain gates fails the completeness check, and it does that by
  # blanking the step and asserting the gate's name no longer appears anywhere in this file — so a comment
  # that spelled the name would keep the string alive and make that property pass on a workflow with the
  # step removed. It fired on exactly that, in this comment.
  #
  # It does not gate `verify` and `verify` does not gate it: they test different things and a developer must
  # be able to run every gate in `pnpm verify` offline, with no Docker daemon and no vulnerability database.
  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The first build of apps/worker/Dockerfile. The agent that wrote it had no Docker daemon, so every
      # offline container rule was proven there and this is where the build itself is proven.
      - name: Build the worker image
        run: docker build --file apps/worker/Dockerfile --tag berelax-worker:ci .

      # The image carries ffmpeg, which pulls in libavcodec and a long tail of codec libraries — the exact
      # reason docs/08 §8 calls ffmpeg in the worker image a cost that "must be budgeted", and the exact
      # surface an npm advisory scan cannot see.
      - name: Scan the worker image for OS and library vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: berelax-worker:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Evidence that the licence obligations the policy records are discharged by the image rather than by
      # a paragraph: the two texts, the notice, the offer, and the recorded build of ffmpeg.
      - name: Third-party licence notices are in the image
        run: |
          docker run --rm berelax-worker:ci sh -eu -c '
            test -s /usr/share/common-licenses/LGPL-3
            test -s /usr/share/common-licenses/GPL-3
            test -s /usr/share/common-licenses/GPL-2
            test -s /usr/share/berelax/THIRD-PARTY-NOTICES.md
            test -s /usr/share/berelax/ffmpeg-buildconf.txt
            test -s /usr/share/berelax/ffmpeg-packages.txt
            test -s /usr/share/berelax/libvips-version.txt
          '

      # And that the encoder in the image is the one the renditions are specified against. `-c:v h264` on a
      # build without libx264 silently selects whatever H.264 encoder is present, which is the failure
      # `[video-encoder-not-available]` exists to refuse at run time.
      - name: The image carries the encoders the renditions are specified with
        run: |
          docker run --rm berelax-worker:ci sh -eu -c '
            ffmpeg -hide_banner -encoders | grep -q libx264
            ffmpeg -hide_banner -encoders | grep -q libx265
          '
