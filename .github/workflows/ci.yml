name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  # Non-production, so the staging send guard (F03) refuses every outbound transport.
  TEST_DATABASE_URL: postgres://berelax:berelax@127.0.0.1:5432/berelax_test
  DATABASE_URL: postgres://berelax:berelax@127.0.0.1:5432/berelax_test

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berelax
          POSTGRES_PASSWORD: berelax
          POSTGRES_DB: berelax_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U berelax -d berelax_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # packages/pdf renders documents in headless Chromium so Arabic shaping and bidirectional
      # layout are done by an engine that gets them right (docs/adr/0011). The browser is a build
      # dependency of the integration suite, not an optional extra.
      - name: Install Chromium for PDF rendering
        run: pnpm exec playwright install --with-deps chromium

      # Ordered cheapest-first so a trivial mistake fails in seconds, not minutes.
      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Module boundaries
        run: pnpm boundaries

      - name: Module boundaries actually reject violations
        run: pnpm boundaries:test

      - name: Core purity gate
        run: pnpm purity

      - name: No invisible or bidi-reordering characters in source
        run: pnpm invisibles

      # Four supply-chain gates (H-HARD-02). All four are offline by construction, because `pnpm verify`
      # runs on every unit by every agent and a gate that needs the network is a gate that gets skipped.
      - name: No credentials in the repository
        run: pnpm secrets

      - name: Dependency advisories (offline snapshot)
        run: pnpm deps

      - name: Outbound licence policy
        run: pnpm licences

      - name: Container and image policy
        run: pnpm container

      # The online half of dependency scanning, and the only step in this workflow that reaches the
      # network for a check. It stays out of `pnpm verify` deliberately: a developer offline, or an agent
      # behind a proxy, must still be able to run the whole gate list. When this reports something the
      # snapshot does not have, the finding is written into build/advisories.json and either fixed or
      # accepted there with a dated expiry.
      - name: Dependency advisories (live database)
        run: pnpm audit:online

      - name: Palette contrast gate
        run: pnpm palette

      - name: Generated token stylesheets are current
        run: pnpm tokens

      - name: Colour token discipline
        run: pnpm colours

      # Every cron this system runs is one array a person can read, and a malformed expression is
      # accepted by pg-boss and then never fires.
      - name: Job registry and cron declarations
        run: pnpm jobs

      # Price, duration, bookability and VAT live in the catalogue and nowhere else. A `price` field on a
      # CMS collection is a second place the number can be wrong, and the one that is wrong is the one
      # nobody reconciles.
      - name: Catalogue/CMS boundary
        run: pnpm cms

      # The Google refresh token is a durable bearer credential for control of the business's Google
      # presence, and the scope it carries has no read-only variant. Three rules dependency-cruiser
      # cannot express: a sealed column named outside the token modules, an accessor identifier, and a
      # token interpolated into a template literal.
      - name: Google token chokepoint
        run: pnpm chokepoint

      # The editorial grid, the direction multiplier and the one shadow. Static rules, so they run with
      # the other cheap scans rather than after the browser work.
      - name: Layout, motion and elevation discipline
        run: pnpm layout

      - name: Every locked decision has an ADR
        run: pnpm adr

      - name: Progress ledger matches the manifest
        run: pnpm progress:check

      - name: Media library matches its manifest
        run: pnpm media

      - name: Fixture salon unchanged
        run: pnpm fixtures

      # The metric-matched font fallbacks are measured in Chromium and committed. A face changed
      # without regenerating them reflows every line on swap, which is the CLS this gate exists to stop.
      - name: Font fallback metrics current
        run: pnpm fonts

      # The critique pass reads the rendered DOM against docs/08. It catches what a pixel diff
      # cannot: a defect present since the first commit, when there is no baseline to diff against.
      - name: Design self-critique
        run: pnpm critique

      - name: Accessibility (axe, WCAG 2.1/2.2 AA)
        run: pnpm a11y

      # docs/08 §4's two numbers nobody checks: 48px on a phone, 40px on a desk, 8px between targets.
      # A mis-tap is not visible in code review and is the whole booking flow on a phone.
      - name: Touch targets
        run: pnpm touch-targets

      - name: Unit tests and coverage thresholds
        run: pnpm coverage

      # The integration suite drives the *built* application: shell.itest.ts and kitchen-sink.itest.ts
      # both spawn `next start`, which needs a build to start at all. Without this step those two files
      # fail in CI on a missing `.next` while passing for anybody who had built locally.
      - name: Build the web application
        run: pnpm --filter @berelax/web build

      - name: Integration tests (real PostgreSQL)
        run: pnpm test:integration

      - name: Migration dry run
        run: pnpm db:migrate:dry

      - name: Schema drift (Drizzle vs database)
        run: pnpm db:drift

      - name: Schema conventions (timestamptz, integer money)
        run: pnpm db:conventions

      - name: Byte budgets
        run: pnpm budgets

      - name: Gates fire
        run: pnpm gates:test
