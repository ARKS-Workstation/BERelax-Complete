# The CRM's nginx vhost, for a droplet that already serves something else.
#
# Install as `/etc/nginx/sites-available/berelax-crm`, symlink into `sites-enabled`, then
# `nginx -t && systemctl reload nginx`. RUNBOOK §4 has the sequence and the certificate step.
#
# ## It is a SEPARATE server block, and that is the whole point
#
# The droplet serves a live customer-facing site. Editing that site's vhost to add a `location` for the
# CRM would put both behind one config file, where a syntax error takes down the site that is earning
# money — `nginx -t` catches most of those, but a reload with a valid-but-wrong config does not fail, it
# just serves the wrong thing. A separate `server` block matched by `server_name` shares nothing with the
# existing site except the daemon, and removing it is deleting one symlink.
#
# `server_name` must be a subdomain of its own with its own DNS record. It must NOT be
# `berelaxmassage.com`: that name already resolves to this droplet and is served by the spa-management
# platform, and two server blocks claiming one name is undefined behaviour in practice — nginx takes the
# first one loaded, which depends on filename order.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_SUBDOMAIN.berelaxmassage.com;

    # Certbot writes its challenge here and nothing else is served over port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name REPLACE_SUBDOMAIN.berelaxmassage.com;

    # Written by `certbot --nginx`. RUNBOOK §4.
    ssl_certificate     /etc/letsencrypt/live/REPLACE_SUBDOMAIN.berelaxmassage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_SUBDOMAIN.berelaxmassage.com/privkey.pem;

    # NOT set here, deliberately: CSP, HSTS, X-Frame-Options, Referrer-Policy and the rest.
    #
    # `apps/web/proxy.ts` emits the whole header set on every return path, and `pnpm headers` asserts that
    # — including the per-response CSP nonce the admin documents carry, which only the application can
    # produce. A header added here would either duplicate one the application already sent or, worse,
    # silently replace a nonce-bearing CSP with a static one, which breaks every inline script in the
    # admin estate. One author per header.

    # An admin estate behind this: no caching anywhere in the path. The application already sends
    # `cache-control: no-store` on every admin response; this stops a proxy cache being introduced later
    # from quietly undoing that.
    proxy_buffering off;

    # Documents render through Chromium (ADR 0011) and a PDF of a month's statements is not quick.
    # 300s rather than the 60s default, because a timeout here returns 504 to an operator who then
    # presses the button again, which starts a SECOND render on a box that is already busy.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Media and document uploads. 0 would accept anything, which is how a 4 GB box runs out of disk.
    client_max_body_size 32m;

    location / {
        # 127.0.0.1 and not a container name or a public address: the compose file publishes the web
        # service to loopback only, so this is the one route in and nothing is reachable if nginx is
        # stopped. Change the port only alongside WEB_PORT in `.env`.
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The application derives absolute URLs from SITE_ORIGIN rather than from this header, so it is
        # here for logs and for rate limiting by scheme, not as the source of truth. A proxy that sent
        # `http` while the client used `https` is the usual cause of a redirect loop; this cannot.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Upgrade headers, so a future websocket (nothing uses one today) does not need this file edited
        # under pressure.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# `$connection_upgrade` is not built in. If the droplet's nginx.conf does not already define this map —
# `grep -r connection_upgrade /etc/nginx/` — add it inside the `http` block of /etc/nginx/nginx.conf, NOT
# here: a `map` is only valid at `http` level and nginx refuses to start with one in a server block.
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
