# BE RELAX — DigitalOcean App Platform spec, STAGING.
#
# Applied with `doctl apps create --spec .do/app.staging.yaml` the first time and
# `doctl apps update <id> --spec .do/app.staging.yaml` after that. `.do/README.md` is the order to do it
# in, and it is not optional reading: the web build reads the database, so the database has to hold content
# before the first deploy can succeed.
#
# What this environment is for: everything but real customers and real providers. `APP_ENV=staging` makes
# `packages/config/src/env.ts` refuse `real` for every provider — a staging run cannot message a client,
# cannot spend a model's budget, cannot write a real staff portrait into a real bucket and cannot
# authorise a card. That refusal is the whole reason this file exists separately from the production one,
# and it is enforced by the application rather than by this spec.
#
# The topology is docs/02 §2's: a `web` service, a `worker` worker, one managed PostgreSQL 16, with
# Cloudflare in front of the web service in production. Staging runs one web instance rather than two —
# it has no availability requirement, and a single instance makes an ISR cache that is per-instance
# behave the same way twice running.

name: berelax-staging

# Frankfurt. DigitalOcean has no UAE region, and for staging that is a cost-and-latency question rather
# than a legal one: no real clinical record and no real customer is in this environment. The production
# spec does NOT get to make the same shrug — see `.do/app.production.yaml`.
region: fra1

services:
  - name: web
    dockerfile_path: apps/web/Dockerfile
    source_dir: /
    github:
      repo: ARKS-Workstation/BERelax-Complete
      branch: main
      deploy_on_push: false

    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    http_port: 3000

    # `/` is prerendered, so the health check costs a static file read and not a database round trip. It is
    # also the page that proves the build had facts: an instance that answers 200 here has the premises row,
    # the catalogue and the roster baked in, which is the thing most likely to have gone wrong.
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 10
      failure_threshold: 5

    envs:
      - key: APP_ENV
        scope: RUN_TIME
        value: staging

      # **Only `RUN_TIME`, and the binding is why.** App Platform does NOT interpolate a database binding
      # at BUILD time — measured: the build received the literal nine-character string
      # `${db.DATABASE_URL}` and `next build` died with `Failed to collect page data for
      # /ar/treatments/[slug]`. Since `/` and `/ar` prerender from the database, the build needs a REAL
      # url, and it cannot come from this file: a connection string in git is a credential in git.
      #
      # So the first deploy of a new app has one manual step, and `.do/README.md` §4 is it: set a
      # `RUN_AND_BUILD_TIME` `DATABASE_URL` secret on the app with the cluster's own URI, which overrides
      # this entry. `pnpm deploy:preflight` refuses a spec that tries to do it with a binding instead,
      # because that failure is silent until a build is already running.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

      # The origin every canonical URL and hreflang alternate is built from, read at RENDER time and
      # therefore at BUILD time for the statically rendered routes.
      #
      # **`${APP_URL}` cannot do this job, and the failure is the dangerous one.** A platform binding is
      # not interpolated at build time, so the build saw no value, fell back to `SITE_ORIGIN_FALLBACK` in
      # `@berelax/shared`, and the staging site served `rel="canonical" href="https://berelaxmassage.com/"`
      # — a preview asking Google to index production copies of unreviewed pages, which is the exact harm
      # that fallback's own comment names. Measured on the first live deploy.
      #
      # The assigned hostname is not knowable before the app exists, so it cannot be a literal here
      # either. `.do/README.md` §3 makes setting it a STEP of creating the app rather than a thing to
      # remember: a `RUN_AND_BUILD_TIME` `SITE_ORIGIN` of the app's own URL, then one redeploy, before the
      # hostname is given to anybody. `RUN_TIME` alone is not enough, because the pages are prerendered.
      - key: SITE_ORIGIN
        scope: RUN_TIME
        value: ${APP_URL}

      - key: BUSINESS_TIMEZONE
        scope: RUN_TIME
        value: Asia/Dubai

      - key: LOG_LEVEL
        scope: RUN_TIME
        value: debug

      # Every provider fake, and in staging that is not a choice: `APP_ENV=staging` with any of these set
      # to `real` is a refused configuration and the process will not boot. They are written out rather
      # than left to their defaults so the health panel and this file say the same thing.
      - key: SMS_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: EMAIL_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: GOOGLE_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: PAYMENT_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: LLM_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: ANALYTICS_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: MEDIA_STORAGE
        scope: RUN_TIME
        value: fake

      # The named test handset, if there is one. Empty is the safe value: with nothing here every outbound
      # message goes to the local outbox. A number added here must be one somebody consented to receive
      # test traffic on.
      - key: OUTBOUND_ALLOWLIST
        scope: RUN_TIME
        value: ''

workers:
  - name: worker
    dockerfile_path: apps/worker/Dockerfile
    source_dir: /
    github:
      repo: ARKS-Workstation/BERelax-Complete
      branch: main
      deploy_on_push: false

    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb

    envs:
      - key: APP_ENV
        scope: RUN_TIME
        value: staging
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: BUSINESS_TIMEZONE
        scope: RUN_TIME
        value: Asia/Dubai
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: debug
      # The worker needs it too, and for a sharper reason than the web service: it mints the magic link a
      # reminder carries, and that link goes into an SMS where a wrong origin is a dead tap.
      - key: SITE_ORIGIN
        scope: RUN_TIME
        value: ${APP_URL}
      - key: SMS_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: EMAIL_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: GOOGLE_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: PAYMENT_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: LLM_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: ANALYTICS_PROVIDER
        scope: RUN_TIME
        value: fake
      - key: MEDIA_STORAGE
        scope: RUN_TIME
        value: fake
      - key: OUTBOUND_ALLOWLIST
        scope: RUN_TIME
        value: ''

jobs:
  # Migrations run BEFORE the new containers take traffic and AFTER the image is built. That ordering is a
  # property of App Platform, not a choice, and it has one consequence worth stating here because it will
  # bite somebody: a migration that adds a column the BUILD reads cannot arrive in the same deploy as the
  # code that reads it. `.do/README.md` has the two-phase sequence for that case.
  #
  # It uses the worker image because that image already carries the whole workspace, pnpm and tsx, and
  # `pnpm db:apply` is `node scripts/apply-migrations.mjs`. A third image for one command would be a third
  # thing to scan and bump.
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: apps/worker/Dockerfile
    source_dir: /
    github:
      repo: ARKS-Workstation/BERelax-Complete
      branch: main
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    # `pnpm db:deploy` and NOT `pnpm db:apply`. The two are different tools with different contracts:
    # `db:apply` takes an EMPTY schema to the current one and refuses anything else, which is right for CI
    # and useless for a deployment — measured here, on the first real deploy, which applied 134 migrations
    # and then failed the next time with "already holds 222 table(s)". `db:deploy` keeps a
    # `schema_migration` ledger, applies only what is pending, refuses a migration edited after it was
    # applied, and is a no-op when there is nothing to do. A database brought up by `db:apply` needs
    # `pnpm db:deploy --adopt` once before its first deploy; `.do/README.md` §2 has that step.
    # `pnpm deploy:migrate` is `db:deploy` and `cms:migrate`: two migration estates, only one of them
    # this repository's SQL. Payload owns its own tables and `push` is off in production.
    run_command: pnpm deploy:migrate
    envs:
      - key: APP_ENV
        scope: RUN_TIME
        value: staging
      # The DIRECT cluster credential and never a connection-pool one. `scripts/apply-migrations.mjs` runs
      # each migration in its own transaction and PgBouncer's transaction pooling is fine with that, but a
      # pool also silently caps what a long `CREATE INDEX` may hold — and the one thing a half-applied
      # migration run must not be is ambiguous.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

databases:
  # A development database, which is what App Platform can create from a spec. It has no standby and no
  # connection pool, and for staging neither is wanted: the point of this environment is the application,
  # not the cluster. Production attaches a real cluster instead — see `.do/app.production.yaml`.
  - name: db
    engine: PG
    version: '16'
    production: false
