      B-AVAIL-03''s assignment and B-AVAIL-06''s to enforce. (5) booking has no status column at all,
      deliberately: a booking''s state is a projection of its appointments, and a second status column
      makes "is this cancelled?" a question with two answers the first time a multi-appointment booking
      is half-cancelled. B-LIFE-01 owns the lifecycle, B-LIFE-03 the partial-cancellation rule.'
