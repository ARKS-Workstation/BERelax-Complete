    - A step whose send time passed during a simulated 6-hour worker outage is either sent with a recorded
      staleness note or skipped with a recorded reason code; a test asserts no step ends in a silent unrecorded
      state
    - Draining the same scheduled_step twice produces exactly one message row, asserted
