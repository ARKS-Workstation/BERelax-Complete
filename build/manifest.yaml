  - id: B-AVAIL-02
    order: 21
    title: 'The pure availability solver: trading window, duration, turnaround, buffers, lead and advance'
    summary: The core of the project. A pure packages/core solver that, given injected shifts, appointments,
      blocks, closures and the business day, generates candidate slots satisfying the window, duration-plus-turnaround,
      therapist-buffer, minimum-lead and maximum-advance constraints. Turnaround occupies the room; buffer
      occupies the therapist; they are never conflated. No slot table is ever materialised.
    owner: claude
    status: todo
    size: L
    depends_on:
    - B-CAT-01
    - B-CAT-03
    - F05
    blocked_on_owner:
    - Y9-turnaround
    - Y9-buffer
    - Y9-lead
    provisional: 20 min standard / 30 min wet-room turnaround, 10 min therapist buffer each side, 2h minimum
      lead time, 90-day maximum advance window. All four are F09 settings flagged provisional:true.
    acceptance:
    - 'Property-based test over at least 10,000 generated cases: no returned slot satisfies start + duration
      + turnaround > business_day.closes_at, and no returned slot''s therapist interval (start - buffer,
      end + buffer) overlaps an existing appointment, block or shift gap'
    - 'Worked examples asserted to the minute: a 120-minute Arabic massage with 20-minute turnaround on
      an 11:00-02:00 day has last bookable start 23:40; the same duration in the wet room with 30-minute
      turnaround has last bookable start 23:30'
    - A 45-minute treatment starting 01:00 with 20-minute turnaround is offered; any positive-duration treatment
      starting 01:55 is never offered; a booking whose treatment ends exactly at 02:00 with zero turnaround
      configured is offered, proving the boundary is inclusive of close
    - 'Turnaround and buffer are proven distinct resources: for one appointment the test asserts room-busy
      = [start, end + turnaround) and therapist-busy = [start - buffer, end + buffer), and swapping the
      two configured values changes which resource reports a conflict'
    - Slots inside a premises_closure are absent, and a closure beginning mid-treatment removes that slot
      rather than truncating it
    - 'Lead and advance boundaries are exact: now + 2h - 1min is excluded, now + 2h is included, day 90
      is included and day 91 is excluded, all under the frozen clock'
    - A schema assertion proves no precomputed slot or availability_cache table exists in the migrations,
      enforcing compute-on-demand
    files:
    - packages/core/src/availability/solve.ts
    - packages/core/src/availability/intervals.ts
    - packages/core/src/availability/solve.property.test.ts
    - packages/core/src/availability/solve.worked.test.ts
