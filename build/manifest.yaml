  - id: B-AVAIL-01
    order: 20
    title: Booking and appointment schema with the concurrency constraints
    summary: The booking (commercial container) and appointment (n per booking) tables, the btree_gist exclusion
      constraint on (therapist_id, period), the DEFERRED constraint trigger counting room overlaps against
      rooms.capacity, appointment_status_history and booking_idempotency. All tested against real Postgres
      because these cannot be tested against a mock.
    owner: claude
    status: done
    size: L
    depends_on:
    - B-CAT-03
    - F04
    - F06
    acceptance:
    - EXCLUDE USING gist (therapist_id WITH =, period WITH &&) exists on appointment; inserting two overlapping
      appointments for one therapist raises an exclusion violation, asserted by SQLSTATE 23P01 against real
      Postgres
    - 'The room-capacity trigger is declared CONSTRAINT TRIGGER ... DEFERRABLE INITIALLY DEFERRED: a Couple
      Massage booking inserting two appointments into the capacity-2 room commits successfully, and a third
      overlapping insert fails at COMMIT rather than at INSERT, asserted by the statement at which the error
      surfaces'
    - A deliberately IMMEDIATE variant of the same trigger, kept as a test fixture, is proven to reject
      the legitimate second couples row — the regression that justifies DEFERRED, referenced from the ADR
    - Cancelled and no-show appointments are excluded from both constraints via the trigger predicate and
      a partial exclusion index; a test cancels an appointment and successfully re-books the freed period
      for the same therapist and room
    - period is tstzrange with '[)' bounds and a CHECK upper(period) > lower(period); two appointments abutting
      exactly at a boundary instant both insert successfully for the same therapist
    - The app role has no UPDATE or DELETE privilege on appointment_status_history, asserted by attempting
      both and checking for insufficient_privilege
    - Reducing rooms.capacity below the maximum number of concurrently booked appointments in that room
      is refused with a named `capacity_below_committed` error, asserted with a capacity-2 room holding
      a couples booking
    - 'NOTE: the concrete file names this list left as placeholders. The migration is
      packages/db/migrations/0024_appointment_constraints.sql and the record is
      docs/adr/0024-deferred-room-capacity-trigger.md. The test suite is booking-constraints.itest.ts,
      not .test.ts: packages/db has no database in the unit runner, so a database-backed suite there
      must be an .itest.ts or it never connects - the same correction B-LIFE-02 made for otp.itest.ts.
      SCHEMA_VERSION is 24.'
    - 'NOTE: PostgreSQL 16 DOES accept a WHERE predicate on an EXCLUDE table constraint, both inline in
      CREATE TABLE and through ALTER TABLE ... ADD CONSTRAINT; this was verified against the running
      server rather than assumed. It is UNIQUE that has no partial constraint form and has to be a
      partial unique INDEX instead. So "a partial exclusion index" is satisfied by a real named
      constraint whose backing index carries the predicate, which is strictly better than a bare index:
      a violation arrives as SQLSTATE 23P01 naming the rule, pg_constraint can be asserted against, and
      an EXCLUDE cannot be enforced by an index alone in any case. The predicate reads one stored
      generated column, appointment.holds_resources, so the exclusion constraint, the partial gist index
      and the capacity trigger share one definition of "still holds its therapist and room" instead of
      restating the status list three times.'
    - 'NOTE: the IMMEDIATE-variant fixture rejects the legitimate second couples row exactly as this
      list asks, but it has to do it on a rearrangement rather than on an insert-only couples booking,
      and that is not a narrowing - it is the only shape in which the claim is true. A counting
      constraint cannot be transiently violated by INSERTs alone, because counts only rise: two
      appointments in a capacity-2 room are within capacity whether the trigger is immediate or
      deferred. The fixture therefore swaps a couples booking at 19:00 with a single appointment at
      20:00 in the one couples room. The first move is accepted, the second - the legitimate second row
      of the couples booking - is refused by the IMMEDIATE variant with room_over_capacity, and the
      identical trigger, deferred, accepts all three statements and commits. A third case proves the
      deferred trigger is not merely a trigger that never fires. ADR 0024 sets this out as a table.'
    - 'NOTE: the capacity_below_committed case uses a capacity-2 room of type standard created by the
      fixture, NOT the seeded couples room this line names, and the difference is the whole point.
      0012 rooms_couples_holds_two already refuses ANY couples room below capacity 2, so a reduction
      of the seeded couples room is rejected by a constraint that has nothing to do with the
      appointments in it - capacity_below_committed could have been dead code for ever while the test
      reported success. Both rules are asserted, each by its own name, in separate cases. The guard
      also counts only appointments that have not ENDED: a past appointment happened, and refusing a
      reduction because of last year''s bookings is a room whose capacity can never be corrected.'
    - 'NOTE: scoped where a dependency does not exist yet. (1) appointment.therapist_id is a plain uuid
      with no foreign key, because there is no employee table - B-AVAIL-04 builds it and depends on
      this unit. The exclusion constraint needs no parent: it compares the column to itself. (2) The
      SELECT ... FOR UPDATE on the rooms row that docs/01 decision 9 pairs with this trigger is NOT
      here. It belongs to the booking transaction (B-AVAIL-06), and without it two concurrent
      transactions can each count two overlapping appointments and each commit a third. The trigger is
      necessary and not sufficient under concurrency; ADR 0024 records that as a consequence rather
      than leaving it implied. (3) appointment_status_history carries no actor, role or reason columns.
      B-LIFE-01 asks for those on the transition and owns the API that knows them; this unit provides
      the chain (from_status, to_status, occurred_at), written by a trigger so a transition without a
      history row is unreachable, and attribution stays in audit_event - one fact, one source. (4) The
      appointment carries shape but nothing enforces that (service, shape, room_type) is an eligible
      triple: service_resource_shape is keyed on the service natural key, which this table reaches only
