  - id: G-CONN-05
    order: 155
    title: Account and location picker, LOCATION_GROUP enumeration, GSC selected independently
    summary: Enumerate under every account because LOCATION_GROUP accounts hold locations the PERSONAL account
      does not return, dedupe by placeId, and persist accountId because the legacy v4 reviews path needs
      it while v1 returns only locations/{l}. Search Console capability is selectable and verifiable on
      a connection whose GBP access is still pending.
    owner: claude
    status: done
    size: M
    depends_on:
