  - id: W-SYS-08
    order: 141
    title: Payload CMS v3 embedded, content model and the catalogue boundary
    summary: Mount Payload v3 inside apps/web on the same Postgres in its own schema, model narrative content
      only, bind access to the F07 roles, and make the catalogue/CMS boundary a mechanical fact rather than
      a convention.
    owner: claude
    status: done
    size: L
    depends_on:
    - F07
    - F09
    - W-SYS-01
    blocked_on_owner: []
    acceptance:
    - Payload v3 mounts at /admin inside apps/web against the same Postgres in its own schema; `pnpm db:migrate:dry`
      and `pnpm db:drift` stay green with both Drizzle and Payload migrations present
    - Collections pages, journal_posts, faq_entries, service_narrative, therapist_narrative and testimonials
      exist with drafts and versions; access control tests prove a receptionist cannot publish and an editor
      cannot mutate a compliance-locked global
    - 'Catalogue boundary: a schema assertion over the generated Payload config finds no field named price,
      duration, bookable or vat; service_narrative references the catalogue service by UUID with no cross-boundary
      FK; rendering a price from CMS data is a compile error (type-level assertion)'
    - Unpublishing or deleting a service_narrative whose catalogue service has future bookings is refused
      with a named error, while archiving succeeds (integration test against real Postgres)
    - Every CMS mutation — create, update, publish, version revert — writes an audit_event with before/after
      (assertion on the audit table, F06)
    - 'Payload admin routes return `x-robots-tag: noindex`, are absent from every sitemap, and are absent
      from the public route registry (enumerated assertions)'
    - 'NOTE: the content model, the catalogue-boundary rules, the CMS access policy and the route prefixes
      live in a NEW package, packages/cms, not in apps/web. The reason is the compile-error half of the
      boundary: the root typecheck project excludes apps/web (it has its own tsconfig with jsx and the DOM
      lib), so a @ts-expect-error inside apps/web is never judged by pnpm typecheck. apps/web/src/collections
      and apps/web/src/globals are thin adapters that turn each descriptor into a Payload CollectionConfig.'
    - 'NOTE: the compile-error assertion is packages/cms/src/boundary.test.ts. ServiceNarrativeDocument is
      DERIVED from the field descriptors by documents.ts, so adding a price field to the model makes the
      @ts-expect-error unused and pnpm typecheck reports TS2578. Mutation-tested, and the mutation is a
      permanent fixture in scripts/test-gates.mjs. The sample document is ANNOTATED rather than `satisfies`-ed
      on purpose: with `as const satisfies`, its type stays the literal''s, so the directive would remain used
      after a price field was added and the mutation would report only a missing property.'
    - 'NOTE: a new gate, pnpm cms (scripts/check-cms-boundary.mjs), with four machine-readable rules —
      no-catalogue-field-in-cms, catalogue-reference-must-be-a-plain-uuid, therapist-narrative-carries-no-name
      and payload-admin-must-not-load-the-site-stylesheet. It runs over the descriptor sources AND over the
      config buildConfig actually generated, and refuses to report success if either examined zero fields.
      Eight new cases in scripts/test-gates.mjs, two of them controls. Added to pnpm verify and to ci.yml.'
    - 'NOTE: Tailwind and Payload are kept apart by the route group itself. app/globals.css is imported by
      the two locale root layouts and by nothing under (payload); @payloadcms/next/css is imported by
      app/(payload)/layout.tsx and nowhere else. Next scopes a CSS import to the layout subtree, so the two
      never load together — measured, not assumed: /admin and / share ZERO stylesheet chunks in the built
      app, the admin bundle contains none of our tokens and the site bundle none of Payload''s
      --theme-elevation-* variables. The fourth gate rule fails the build if either import crosses.'
    - 'NOTE: Payload''s REST API is mounted at /cms-api, not at its default /api. /api belongs to the
      application (docs/09 documents /api/facts as public) and Payload''s route is a catch-all, so the
      default would put a catch-all in one root layout group and a static sibling in another. GraphQL is
      disabled outright: every field it exposes is a field the access rules must be right about twice.'
    - 'NOTE: SCOPED — the booking count behind the unpublish/delete refusal. The catalogue service table and the
      appointment table do not exist yet (B-CAT-03 and B-AVAIL-01 are todo), so the real probe in
      apps/web/src/payload/future-bookings.ts answers `unknowable` and the rule FAILS CLOSED — refused, with
      the named error service_narrative_bookings_unknowable, rather than treated as zero. The counted
      branches (refuse at >0, allow at 0, always allow archive) are proved in the integration test through an
      injected probe, and the real probe''s `unknowable` answer is asserted against this database as it
      stands. Deferred to B-CAT-03/B-AVAIL-01 to land public.appointment(service_id, starts_at); the archive
      301 and sitemap removal are W-SITE-05''s.'
    - 'NOTE: SCOPED — "absent from every sitemap" and "absent from the public route registry". Neither exists yet —
      the route registry is W-SITE-01''s and the sitemaps are W-SITE-10''s, both todo. Delivered instead:
      CMS_ROUTE_PREFIXES, isCmsRoute and cmsRoutesIn in @berelax/cms for those two units to assert against,
      so the exclusion is written down once rather than as a second list in each; plus the enumerated
      x-robots-tag assertions, which ARE satisfied in full — against the real next.config.ts object in
      apps/web/src/payload-routes.test.ts (every prefix covered, with a control that no public path is) and
      against a live response from the built app.'
    - 'NOTE: SCOPED — the admin''s identity store and its second factor. F07 landed as packages/auth (password,
      TOTP and session primitives) plus the matrix in packages/core, and it created NO staff_user table —
      nothing in the migration chain holds a staff identity and no manifest unit declares one. Payload''s
      admin needs an auth collection to exist at all, so cms_user lives in the payload schema with a role
      constrained to the F07 ROLES set, and every access decision goes through can(role, permission). What
      is therefore missing: ADR 0009 makes TOTP mandatory for owner, manager and accountant, and Payload''s
      local strategy has no second factor, so this admin authenticates with a password alone. Deferred to
      whichever unit introduces staff_user/staff_session, at which point cms_user becomes a custom
      authStrategies projection of it and no access rule in apps/web changes.'
    - 'NOTE: the manifest asks that "an editor cannot mutate a compliance-locked global". F07 has no `editor`
      role; marketer and manager are the roles holding content:write, and both are refused on
      compliance_notices (settings:write_compliance, owner-only) while both are allowed on
      editorial_defaults — the control that stops the refusal being "deny every global". The related finding
      is stronger than the acceptance line: content:publish appears in NO role''s grant list except the
      owner''s wildcard, so manager and marketer DRAFT and only the owner publishes. Bound to the matrix as
      it landed; widening an authorisation matrix from a CMS unit is how a matrix stops meaning anything.'
    - 'NOTE: the audit row is written inside Payload''s OWN transaction, through the drizzle session for
      req.transactionID, rather than through @berelax/db''s AuditWriter — which holds a postgres connection
      of its own and would leave an audit row describing a change a rollback undid. Proved by rolling a
      transaction back and asserting the row went with it, with the committing case as the control.
      Unpublish and version revert are classified rather than recorded as plain updates: Payload reports all
      three as `update`, and a trail in which they are indistinguishable cannot answer who took a page down.'
    - 'NOTE: the content model has no numeric field type at all (CONTENT_FIELD_TYPES). Every number this
      business cares about is money in integer fils (ADR 0007), a duration, or a count, and each has an
      owner that is not the CMS. FAQ ordering uses Payload''s own orderable column instead of an editorial
      order number.'
