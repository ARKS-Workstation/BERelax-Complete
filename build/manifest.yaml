    acceptance:
    - For a fixture original the job emits exactly the declared ladders — mobile 4:5 [414,640,828,1080]
      and desktop 16:9 [1024,1440,1920,2560] — in AVIF q52/effort4, WebP q76 and mozjpeg q80, asserted by
      listing outputs; no undeclared width is produced
    - Every derivative path matches `^/m/[0-9a-f-]{36}/[0-9a-f]{16}/[a-z0-9-]+-\d+\.(avif|webp|jpg)$` and
      the 16 hex chars equal the first 16 of the sha256 of the source bytes; a second run on unchanged bytes
      re-encodes nothing (encode counter 0) and produces byte-identical outputs
    - 'A served derivative responds `Cache-Control: public, max-age=31536000, immutable` and its embedded
      ICC profile is sRGB after the rgb16->srgb pipeline (sharp metadata assertion)'
    - Placeholder colour for all 12 fixture images is OKLCH with chroma <=0.06 and lightness in [0.86,0.94]
      (property test); grep asserts no blurhash dependency or string is produced
    - next/image loader maps every requested width in 1..3000 to the nearest declared rung (table test)
      and a Playwright network assertion confirms every image request URL is in the declared set
    - The widest fixture hero AVIF is <=95KB on the 4:5 crop and <=170KB on the 16:9 crop; an oversized
      fixture makes the check fail with the measured byte count (gate-fires proof)
    - A crawl of all routes finds zero URLs containing `/originals/` or `cdn.digitaloceanspaces.com`; the
      fake storage adapter writes every put to a visible local outbox directory and never returns success
      silently (docs/12 §1 prohibition)
    - 'NOTE: the route crawl in the seventh criterion is scoped to W-SITE. apps/web has two placeholder
      pages and no image on either, so a crawl of the rendered routes today would pass by having nothing to
      examine. What is asserted instead: a static gate over all of apps/ and packages/
      (scripts/check-media.mjs, [no-private-origin-url], with a known-bad fixture for each spelling), and a
      Playwright network assertion over a rendered page whose srcset comes from the real loader
      (packages/media/src/served.itest.ts), which also asserts the served Cache-Control header. Crawling the
      real site routes belongs with the first route that renders an image.'
    - 'NOTE: the Playwright half of the fifth criterion runs against a page this unit renders rather than a
      site route, for the same reason. The declared set, the widths the loader resolves out of a srcset, the
      response headers and the absence of any private-origin request are all asserted in
      packages/media/src/served.itest.ts. Re-running that assertion over W-SITE''s own routes is W-SITE''s.'
    - 'NOTE: the fourth criterion states the OKLCH band as a measurement, and it is not one — it is the
      clamp docs/08 §6 specifies. All twelve fixture images measure OUTSIDE the band: dominant-colour
      lightness runs from 0.134 (team/team-05.jpg, a near-black frame) to 0.783 (team/team-06.jpg), every
      one below the 0.86 floor, and photos/spa-02.jpg is also over the chroma bound at 0.0755. The bound was
      not weakened and nothing is clamped silently: placeholderFor() keeps the raw measurement and a clamped
      flag, and packages/fixtures/src/media-derivatives.itest.ts asserts that all twelve had to be clamped,
      so replacing the photography with images that really are pastel makes that assertion fail and this
      note get revisited. docs/08 §8''s claim that ''pastel photography is a performance asset'' does not
      hold of this library''s dominant colours. Y12-photos.'
    - 'NOTE: no migration. The reserved packages/db/migrations/0022_media.sql is unused and SCHEMA_VERSION
      stays at 21. Every criterion here is about files, URLs and bytes; idempotence comes from the
