  - id: W-SYS-09
    order: 144
    title: 'Media slots: declared constraints, required alt and the junk-alt filter'
    summary: The named slot registry (hero, therapist portrait, service card, gallery, testimonial background)
      with aspect ratio, minimum dimensions, maximum bytes and required alt enforced server-side, plus the
      junk-alt filter and Payload focal point.
    owner: claude
    status: done
    size: M
    depends_on:
    - W-SYS-05
    - W-SYS-08
    blocked_on_owner:
    - Y12-photos
    provisional: 'Y12-photos: palette-matched placeholders per slot at the declared ratio, each registered
      provisional:true so the Unconfirmed Assumptions panel lists them.'
    acceptance:
    - The slot registry declares aspect ratio, minimum dimensions, max bytes, allowed mime types and altRequired:true
      for all five slots, and grep asserts no component hard-codes an aspect ratio (registry is the single
      source)
    - 'Table test: an upload violating ratio (tolerance +/-0.5%), below minimum dimensions, above max bytes,
      or of a disallowed mime is rejected with a field-level message naming the constraint and the measured
      value; a 12MB portrait hero is rejected outright, never silently resized'
    - 'Alt text: missing, whitespace-only or <15 characters is rejected for every slot; the junk filter
      rejects image, photo, picture, img, hero, banner, untitled, DSC_0031, IMG-2044 (case-insensitive)
      and accepts a descriptive fixture string — asserted as a parameterised corpus with zero false positives
      on 20 good strings'
    - 'focalX/focalY are stored as percentages and crop is applied before resize: moving the focal point
      changes the 4:5 derivative bytes while leaving the 16:9 derivative byte-identical when the subject
      stays in frame'
    - A publish attempt whose slot images fail alt validation or exceed the slot byte budget is refused
      before publication, with the measured weight in the error (integration test through the W-SITE-10
      gate)
    - Every slot has a palette-matched placeholder at the correct ratio, and a test asserts no placeholder
      is served on a published route unless a provisional:true flag for it is returned by the Unconfirmed
      Assumptions query
    - 'NOTE: the registry is the single source in the strong sense, so three things now read it rather than
      restating a slot. `MEDIA_SLOTS` and `CROPPED_SLOTS` in packages/media/src/url.ts are derived from it
      (they were a hand-written copy of three names); `assets/media/manifest.json`''s `slots` block is
      projected from it by scripts/emit-media-manifest.mjs and drift-checked by a new `pnpm media` rule,
      `[slot-spec-must-mirror-the-registry]`, the same generated-and-committed arrangement as tokens.css;
      and every committed asset is measured by `validateUpload` rather than by a second, looser set of
      checks written inside check-media.mjs — which is what revealed that the old checks looked at minimum
      width and a ratio tolerance of their own and never at the byte cap or the mime type at all. The slot
      list grew from three names to six: the five docs/08 §6 names plus `logo`. Two assertions in
      packages/media/src/url.test.ts moved with it — 48 distinct derivative paths became 5 cropped slots x
      24 renditions, and the "unknown slot" fixture moved from `gallery` (now a real slot) to `carousel`,
      because a refusal fixture that has become valid is a refusal nobody is testing.'
    - 'NOTE: the ±0.5% ratio tolerance in the second criterion cannot be applied as a flat rejection, and
      this is the same shape of finding as W-SYS-05''s OKLCH band. 20 of the 23 assets in a slot that
      declares a ratio are outside it — the portraits run 0.461–0.799 against the 4:5 slot''s 0.800, and
      only photos/hero-team.jpg, photos/spa-02.jpg and team/team-16.jpg land inside, the first two at 0.053%
      and the third at 0.125%. What is enforced instead is the tolerance doing the work it can do — a source more
      than 0.5% from its slot''s ratio is refused UNLESS a focal point is declared
      (`[slot-ratio-out-of-tolerance]`), because a centre crop of a full-length portrait is a torso and the
      focal point is the answer that makes the crop a decision. A second finding sits under it, measured in
      apps/web/src/media-slots.itest.ts: Payload 3.89 defaults the focal point to {x:50,y:50} on every
      create (`parseUploadEditsFromReqOrIncomingData`), so `focal === undefined` is never true for an upload
      through the admin and the rule fires only on the path with no Payload in it —
      assets/media/manifest.json, where `pnpm media` checks it and gate case 29a proves it by rule name.
      Treating a centre focal point as "no answer" was considered and rejected: it would refuse
      photos/spa-01.jpg, whose 2.50 frame is correctly centred horizontally. Y12-photos.'
    - 'NOTE: a rule was deliberately NOT written, and the reason is worth keeping. The obvious third ratio
      check — "the crop window at the declared ratio must itself meet the slot minimum" — cannot fire:
      `minHeight` is `minWidth` scaled by the slot''s own ratio, so the window taken out of any source that
      clears minWidth x minHeight clears them too, at every focal point. It was written, found to be
      unreachable by any fixture, and replaced by the implication it actually is — asserted over every slot
      and a sweep of 36 focal points in validate.test.ts, with the converse as the control. A check no
      fixture can trip is the ADR 0003 failure one layer in.'
    - 'NOTE: SCOPED — the fifth criterion, "refused before publication ... integration test through the
      W-SITE-10 gate". W-SITE-10 is todo: there is no draft -> lint_passed -> approved -> published state
      machine and no synthetic weight check to hook into. Delivered for it instead:
      `publicationRefusals` / `assertSlotImagesPublishable` in packages/media/src/slots/validate.ts, which
      take a page''s slot images and answer with `[media-slot-alt-fails-validation]` and
      `[media-slot-over-byte-budget]` carrying the measured weight — unit-tested with the accepting control.
      What IS satisfied in full is the refusal before the row exists: apps/web/src/media-slots.itest.ts
      proves through Payload that a junk-alt or over-cap upload is refused with no row written, and that an
      accepted row is checked again on update, which is the case an upload-time-only check walks past. Note
      also that only the hero has a published byte budget in docs/08 §8 (95KB/170KB); the per-slot figure is
      null elsewhere because docs/08 states none, and the page-level ≤1.9MB/≤3.2MB ceiling is a property of
      a rendered page. Deferred to W-SITE-10.'
    - 'NOTE: SCOPED — the second half of the sixth criterion, "no placeholder is served on a published route
      unless a provisional:true flag for it is returned by the Unconfirmed Assumptions query". Neither half
      of that has anything to attach to yet. No indexable route renders an image: apps/web serves two
      placeholder pages, /kitchen-sink (indexable:false) and the treatment handler, so a crawl today would
      pass by having nothing to examine — the same reason W-SYS-05 scoped its route crawl. And the
      Unconfirmed Assumptions query has exactly two sources, `app_setting` rows
      (`unconfirmedAssumptions` in @berelax/db) and the settings registry (`provisionalSettings` in
      @berelax/config); a placeholder is not a setting anybody sets, so registering five as app_setting rows
      would put non-settings in the settings table. Delivered instead: `provisionalSlotPlaceholders()` in the
      same three-field shape the panel already reads (key, openQuestionId, note), one entry per slot that
      reserves a box, every one flagged against Y12-photos and asserted in registry.test.ts and in
      packages/fixtures/src/media-slots.itest.ts. The FIRST half is satisfied in full and measured:
      packages/ui/src/tokens/slot-placeholders.test.ts computes the OKLCH of all 21 palette tokens and
      asserts every slot''s placeholder sits inside docs/08 §6''s band, with the 18 out-of-band tokens as the
      control. Concatenating the third source into the panel belongs to whichever unit renders it; serving
      the placeholder on a published route belongs to W-SITE-04/W-SITE-06.'
    - 'NOTE: no migration, and no number taken. The reserved 0022_media.sql was never written and stays
      unwritten; SCHEMA_VERSION stays at 29. The `media` table is Payload''s own, in the `payload` schema,
      synced by `push` in development and by `payload migrate` on deploy — the arrangement migration 0023
      exists for — so `pnpm db:drift` never sees it and there is nothing for a hand-written Drizzle mirror
      to mirror. 0030, 0031 and 0032 are untouched.'
    - 'NOTE: the row is metadata and `disableLocalStorage` is on. Payload''s default writes the file beside
      the app and serves it from a public route, and an original must never be publicly readable — docs/08
      §6 puts originals in berelax-private with no CDN and no public read, and nineteen of the twenty-five
      real assets are photographs of employees whose photography consent is open (Y12-consent-photo). What
      is therefore NOT wired: the put into the private bucket through @berelax/media''s storage port and the
      `media.build-derivatives` enqueue. Both need a storage adapter and a pg-boss connection apps/web does
      not have — the same gap W-SYS-05 named as `[no-real-media-storage-adapter]`, seen from the upload side
      — and `derivative_manifest` is a read-only field that stays empty until something fills it, so a row
      without derivatives is visibly incomplete rather than quietly broken. Deferred to whichever unit adds
      the Spaces adapter.'
    - 'NOTE: Payload now gets a `sharp` instance, because it measures an upload''s pixel dimensions and every
      dimension constraint is a check on those numbers — without it `width` and `height` arrive null and
      `assertMediaRowAcceptable` refuses every upload with `[unmeasured-original]`. It is imported through a
      new `@berelax/media/sharp` subpath rather than declared as a dependency of apps/web, and the first
      attempt (declaring it) failed a gate in a way worth recording: `pnpm gates:test` asserts that a licence
      finding "names the package and the path it ships through", checking for `packages/media` in the
      `[unaccepted-weak-copyleft]` message for `@img/sharp-libvips-*`. A direct dependency shortened the
      shipped path to `apps/web > sharp`, and the assertion failed. Routing it through the media package is
      the better answer anyway: two declared `sharp` ranges can resolve to two libvips builds, and then the
      dimensions Payload measures come from one decoder and the crop `buildDerivatives` takes from another.
      One range, one libvips, and the gate assertion is untouched.'
    - 'NOTE: the `logo` slot does not accept an SVG, and docs/08 §9 says "Upload, SVG preferred". An SVG is
      not an image, it is a document that can carry script and external references, and serving an uploaded
      one same-origin is stored XSS; nothing in this repository sanitises one. Both committed wordmarks are
      PNG, so nothing is blocked today. Deferred to whichever unit adds the logo setting, which needs the
      sanitiser before it needs the mime type.'
    - 'NOTE: added beyond the list — a new `pnpm media` rule,
      `[aspect-ratio-must-come-from-the-slot-registry]`, which is how "grep asserts no component hard-codes
      an aspect ratio" is satisfied. It refuses a literal `aspect-ratio:` declaration, an `aspectRatio` style
      property and Tailwind''s `aspect-video` / `aspect-square` / `aspect-[4/5]` anywhere under apps/ or
      packages/ except the registry itself, and allows a `var()` or a `${...}` hole. It found three real
      violations on landing — packages/ui/src/patterns/therapist-card.tsx and two in
      packages/harness/src/specimen.ts — all three now interpolating `slotAspectRatio(...)`, which is why
      packages/ui and packages/harness gained @berelax/media as a dependency. `@berelax/media/slots` and
      `@berelax/media/placeholder` are new sharp-free entry points so neither drags libvips into a browser
      bundle.'
    - 'NOTE: the junk-alt filter is eleven rules rather than docs/08 §6''s one regular expression, and the
      reason is that the regular expression as written is wrong in both directions. Anchored at `^`,
      `/^(image|photo|picture|img|hero|banner|untitled|dsc[_-]?\d+|img[_-]?\d+)/i` rejects "Photograph of a
      massage bed made up with fresh white linen" and "Mirror image of the treatment room reflected in the
      polished stone basin", which are good alt text — two of the twenty good strings are exactly those — and
      it accepts "an image" and "the photo", which are not. It is also defeated by padding: `image image
      image` is seventeen characters and clears every anchored rule. What replaces it is a residue test
      (`alt-is-boilerplate`): strip the words for "a picture", the slot names, the file-naming habits and the
      grammar, and refuse what is left if nothing describing anything remains. The other ten are
      alt-missing, alt-whitespace-only (including zero-width and non-breaking, which look empty on screen),
      alt-too-short (the 15 docs/08 asks for, in code points so Arabic counts), alt-has-too-few-letters,
      alt-is-a-filename (extension, camera-roll pattern, or the uploaded file''s own stem),
      alt-is-a-url, alt-repeats-the-context, alt-is-a-keyword-list, and the two decorative rules below.'
    - 'NOTE: `altRequired: true` on all five slots is typed as the literal `true`, so a descriptor cannot opt
      out — but empty alt is still sometimes correct, and the filter distinguishes empty-by-decision from
      empty-by-omission rather than demanding text everywhere. WCAG 1.1.1 is explicit that a decorative
      image takes alt="", and forcing somebody to describe the linen texture behind a pull-quote is worse
      than silence because a screen reader then reads it out. So a media row may declare itself
      `decorative`, and the registry says which slots may hold decoration: exactly one,
      `testimonial-background`, the only slot whose content is the text in front of it.
      `alt-decorative-not-permitted-in-slot` refuses it anywhere else — a photograph of a member of staff is
      never decoration — and `alt-decorative-must-be-empty` refuses a decorative image that also carries
      text.'
    - 'NOTE: the gate block in scripts/test-gates.mjs proves the filter by MUTATION, in two directions,
      because a junk-alt filter can fail by accepting junk or by rejecting good alt text and a corpus of
      junk is blind to the second. Neutering `alt-is-boilerplate` must make the corpus fail (it does, naming
      the rule), and raising ALT_MIN_LENGTH to 150 must make the twenty good strings fail (it does) — which
      is what says those twenty are load-bearing rather than decorative. Nine more cases cover the media
      gate''s new rules by name with their controls: the hard-coded ratio in three spellings, the legitimate
      registry-read and `var()` forms, the hand-edited manifest slot block, the out-of-ratio asset with no
      focal point, and the byte cap and minimum dimensions exercised by tightening the wordmark slot — the
      only two numbers in the registry that appear once, so the mutation cannot hit a different slot.'
    - 'NOTE: the fourth criterion is proved against real photography and real libvips in
      packages/fixtures/src/media-slots.itest.ts, using photos/hero-team.jpg because its 16:9 window is
      measurably the whole frame (1672/(16/9) rounds to its full 941 height), which is what "the subject
      stays in frame" means for a specific file rather than in the abstract. Moving the focal point from
      {50,45} to {15,45} changes the 4:5 derivative''s sha256 and leaves the 16:9 derivative''s identical,
      with the two crops of the same frame as the control. Crop-before-resize is asserted structurally as
      well: the 4:5 window is 753 source pixels wide while the rung being served is 414, which a pipeline
      that resized first could not take.'
    - 'NOTE: files — `tests/media/slots.spec.ts` was not created. This repository has no `tests/` directory;
      unit tests sit beside the code as `*.test.ts` and integration tests as `*.itest.ts`, which is what
      vitest.config.ts and vitest.integration.config.ts include. The equivalent files are
      packages/media/src/slots/{registry,validate,alt-filter}.test.ts (112 unit tests),
      packages/fixtures/src/media-slots.itest.ts (the real library and the focal point through libvips),
      apps/web/src/media-slots.itest.ts (17 tests through Payload) and
      packages/ui/src/tokens/slot-placeholders.test.ts (the placeholder band).'
    files:
    - packages/media/src/slots/registry.ts
    - packages/media/src/slots/validate.ts
    - packages/media/src/slots/alt-filter.ts
    - packages/media/src/slots/index.ts
