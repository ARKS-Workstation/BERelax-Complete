  - id: G-CONN-02
    order: 152
    title: OAuth consent against the fake, granted-scope truth, sub-match reconnect semantics
    summary: Authorization URL with the two scopes from docs/10 SS3, state and PKCE, code exchange, id_token
      sub extraction. Matching sub is a re-auth that preserves capabilities and history; a different sub
      creates a new connection row and warns loudly, because silently swapping accounts is how replies reach
      the wrong listing.
    owner: claude
    status: done
    size: M
    depends_on:
    - G-CONN-01
    - H02
    blocked_on_owner:
    - Y10-consent
    provisional: Fake consent screen and fake id_token; consent_at recorded from the frozen clock so the
      Testing-expiry tripwire in G-CONN-06 is computable without a real grant
    acceptance:
    - Requested scopes are exactly business.manage and webmasters.readonly; a test asserts the read-write
      'webmasters' scope and any Gmail or GA4 scope never appear in the built authorization URL
    - 'granted_scopes is stored from Google''s response, not the request: a fake returning only webmasters.readonly
      stores that single scope and sets the gbp_reviews capability to permission_missing while the connection
      stays usable for gsc'
    - 'Reconnect with a matching google_sub updates in place: the test asserts the same connection row id,
      the same capability rows and the identical resource_ref.placeId after re-consent'
    - Reconnect with a different google_sub inserts a second row, returns a warning payload naming both
      google_email values, and leaves the original row's status, tokens and capabilities byte-identical
      (asserted field by field)
    - A mismatched state parameter is rejected, and replaying an already-exchanged authorization code is
      rejected with a distinct named error; neither path writes a connection row
    - 'Scope change on re-consent is atomic: a fault injected between the token write and the capability
      write rolls back both, proven by asserting the pre-existing token ciphertext is unchanged after the
      failed transaction'
    - 'NOTE: the scope set is closed by the TYPE SYSTEM, not only by a test. REQUESTED_GOOGLE_SCOPES
      is typed readonly GoogleRequestedScope[] — a union of exactly the two scopes — and
      buildAuthorizationRequest accepts nothing else, so widening the consent is a compile error.
      scripts/test-gates.mjs writes fixtures requesting the read-write webmasters scope and a Gmail
      scope, asserts tsc rejects both by name, and asserts a permitted scope still compiles, because a
      union that rejected everything would make both rejections meaningless. forbiddenScopesIn in
      packages/core repeats the check at runtime for a scope list that arrived as data'
    - 'NOTE: replay rejection is durable, keyed on a SHA-256 fingerprint of the authorization code
      recorded in the google_connection_events detail that the consent wrote, and checked again inside
      the transaction. A state cookie could not do this: a successful exchange clears it, so a cleared
      cookie reports the same thing for a reloaded callback tab and for a forged callback, and those are
      the two cases an operator most needs told apart. No new table and no migration — G-CONN-01 created
      everything used here and SCHEMA_VERSION is untouched'
    - 'NOTE: the fake OAuth provider gained what the flow needs and could not be tested without — a fake
      id_token carrying sub and email (the exchange has no other source for the address), configurable
      granted scopes so the partial-consent path is exercisable, PKCE, and single-use authorization codes
      minted by the consent stand-in and carried in its URL as dev_code. GoogleTokens.idToken,
      AuthorizationUrlArgs and ExchangeCodeOptions are additive; every existing caller still compiles'
    - 'NOTE deferred to H-HARD-03: the connect route reads GOOGLE_TOKEN_KEK from the environment rather
      than from @berelax/config, and refuses the callback loudly when it is absent. Nothing in this
      system loads a KEK at runtime yet — every existing use is generateKek() in a test — so naming the
      app-wide key (one KEK for clinical payloads and Google tokens, or two) belongs with the secret
      inventory in H-HARD-03, and a config key invented here would be the wrong name to migrate away
      from. The start of the consent needs no key and works today'
    - 'NOTE deferred to W-SYS-01: the route is NOT authenticated and the consent cookie is NOT signed.
      There is no admin session to bind either to. The cookie is HttpOnly, SameSite=Lax, Secure and
      ten-minute; the state is compared double-submit, which is the standard OAuth defence, and what it
      does not close is an attacker who can set a cookie on this origin. apps/web/app/(admin)/layout.tsx
      is a minimal root layout mirroring (en) so the route group has a document to render in; the real
      admin shell, and the settings card that reads the outcome query parameters, are W-SYS-01 and
      G-CONN-07'
    - 'NOTE: capability rows created by a consent get health unknown, never ok, when the scope IS
      granted. A consent proves the owner ticked the product and proves nothing about the resource behind
      it — the listing may be unverified, the Business Profile quota is zero until Google approves
      access. ok is G-CONN-06''s to write. capabilityHealthAtConsent in packages/core also preserves a
      previously observed quota_zero or not_verified, because a re-consent is not evidence a failure went
      away'
    files:
