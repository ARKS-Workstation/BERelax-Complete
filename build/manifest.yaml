  - id: B-LIFE-01
    order: 30
    title: Appointment lifecycle state machine with actor permissions and declared side effects
    summary: 'The transition table as data: REQUESTED, CONFIRMED, CHECKED_IN, IN_PROGRESS, COMPLETED, NO_SHOW,
      CANCELLED_BY_CUSTOMER, CANCELLED_BY_SALON, RESCHEDULED. Every transition declares its permitted actor
      roles, its history row and exactly which outbox event it emits. COMPLETED emits revenue; CONFIRMED
      does not.'
    owner: claude
    status: todo
    size: L
    depends_on:
    - B-AVAIL-06
    - F06
    - F07
    acceptance:
    - 'The transition table is a data structure and a test enumerates the full status x status cross product:
      every declared legal transition is accepted and every other pair is refused with a named `illegal_transition`
      error; a coverage assertion proves no default-allow branch exists'
    - 'Each transition declares permitted actor roles and is enforced by the F07 policy layer: a per-transition
      test asserts a receptionist is refused every owner-or-manager-only transition and permitted the rest'
    - CANCELLED_BY_CUSTOMER and CANCELLED_BY_SALON are distinct terminal states with distinct event types;
      a test asserts no function maps both to a shared CANCELLED value
    - Every transition appends exactly one appointment_status_history row carrying actor, role, reason and
      timestamptz, and emits exactly one outbox event of its declared type — asserted for all transitions
      by iterating the table
    - COMPLETED emits appointment.completed; an event-type allowlist test asserts CONFIRMED emits no event
      whose name matches /revenue|sale|invoice/, encoding 'the till knows the truth'
    - Each terminal state declares explicitly whether a repeat of the transition that produced it is an
      idempotent no-op or an error, and a test asserts the declared behaviour per state with no undeclared
      cases
