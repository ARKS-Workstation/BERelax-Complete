  - id: W-SITE-01
    order: 132
    title: Route spine, EN/AR locales, canonicalisation and the route registry
    summary: The typed route registry that drives the sitemap, hreflang and screenshot harness; middleware
      trailing-slash and case normalisation; the /ar subpath locale with real RTL; noindex and sitemap exclusion
      for the admin group.
    owner: claude
    status: done
    size: L
    depends_on:
    - W-SYS-01
    - W-SYS-03
    blocked_on_owner: []
    acceptance:
    - The registry declares every public route with rendering mode, locale set, sitemap inclusion and changefreq;
      a test asserts an exact bijection between registry entries and filesystem routes, so adding a route
      without a registry entry fails the build
    - 'Normalisation table test: /Treatments/, /treatments/, /treatments//x and mixed-case variants each
      resolve to the canonical path in exactly one 301 hop to a 200, with zero chains and zero loops'
    - 'EN at / and AR at /ar: html lang and dir are correct per locale, and hreflang tags are reciprocal,
      self-referential and include x-default for every registry route in both locales (enumerated assertion)'
    - 'Every (admin) route and /analytics returns `x-robots-tag: noindex` and is absent from every sitemap;
      every public route is asserted not to carry that header'
    - 'The screenshot harness (H04) reads the registry: a test asserts every registry route is captured
      at 3 viewports x 2 themes x 2 directions, and fails when a route is added without a capture'
    - 'On /ar the layout is genuinely mirrored: a computed-style assertion confirms the editorial grid''s
      inline-start gutter is on the right and that at least one directional icon is transformed, not merely
      translated'
    - 'NOTE: apps/web/app/(public)/layout.tsx is stale and was NOT created. W-SYS-01 shipped two root layouts
      — app/(en)/layout.tsx and app/(ar)/layout.tsx, both rendering app/_document/shell.tsx, which owns
      <html lang dir>, the font variables and the theme bootstrap — plus app/(admin)/layout.tsx over the same
      shell, and W-SYS-08 added app/(payload)/layout.tsx over Payload''s. Four root layouts already. A
      (public) group would have been a fifth <html> element, and a duplicate of what (en) is: invalid HTML
      that React hydrates wrongly, with two ThemeProviders fighting over one data-theme attribute. The spine
      is built on the groups that exist. Delivered: apps/web/src/routes/registry.ts (the typed registry),
      apps/web/src/i18n/locales.ts (the locale seam), apps/web/src/routes/canonical.ts (normalisation),
      apps/web/src/routes/alternates.ts (canonical URL and hreflang), apps/web/src/routes/discover.ts (the
      filesystem side of the bijection) and app/_routes/route-nav.tsx — an underscore folder, so Next
      excludes it from routing.'
    - 'NOTE: the middleware is apps/web/proxy.ts, not apps/web/middleware.ts. Next 16.3.5 renamed the
      convention: middleware.ts still runs and warns "The middleware file convention is deprecated. Please
      use proxy instead." on every build, and having both is a hard error (E900). Identical semantics and
      identical config.matcher; the exported function must be named proxy, which Next''s entry template
      selects by filename.'
    - 'NOTE: the tests are apps/web/src/routes/registry.test.ts (unit: the bijection, the normalisation
      table, hreflang completeness, the capture plan, the noindex coverage) and
      apps/web/src/route-spine.itest.ts (integration: redirect hops, live headers, rendered hreflang, RTL
      geometry, the captures, and the build manifests) — not tests/routes/registry.spec.ts. This repository
      has no tests/ directory: tests sit beside their source as *.test.ts and *.itest.ts.'
    - 'NOTE: SCOPED — "exactly one 301 hop" for a path with a DOUBLED SLASH. Next collapses repeated slashes
      itself, with an unconditional 308, in resolve-routes.js before any application code runs, and 16.3.5
      has no configuration for it. So /treatments//x reaches its canonical path in exactly one PERMANENT hop
      whose status is 308 rather than 301, and a spelling that also has the wrong case or a trailing slash
      takes Next''s 308 and then the proxy''s 301 — two permanent hops, zero loops, ending at the canonical
      URL. The integration test asserts that shape exactly rather than claiming one hop. Case and
      trailing-slash variants ARE one 301 hop each for every registry document in both locales, which
      required skipTrailingSlashRedirect: true in next.config.ts — Next''s own trailing-slash redirect has
      priority: true and would otherwise chain 308 then 301. The exempt prefixes keep that behaviour: the
      proxy trims their trailing slash with a 308, so POST /api/v1/otp/ is still a POST.'
    - 'NOTE: SCOPED — the acceptance criterion''s literal /treatments paths. The route is W-SITE-04''s and
      does not exist, so the destination of its normalisation is a 404. The hop count, the status and the
      destination are asserted; the 200 at the end is asserted for every route that does exist, in both
      locales, from variants generated out of the registry — so W-SITE-04''s route is covered the day it
      lands with no change to the test.'
    - 'NOTE: SCOPED — "absent from every sitemap". There is no sitemap: W-SITE-08 owns sitemap.xml and the
      per-type sitemaps. Delivered instead: sitemapEntries() in the registry as the only source a sitemap
      may read, with tests asserting it holds exactly / and /ar, that every non-indexable route and every
      handler is absent from it by construction, and that cmsRoutesIn over the registry''s paths is empty.'
    - 'NOTE: SCOPED — /analytics. The route is A-FIRST-10''s and does not exist yet, so it cannot be a
      registry entry: the bijection refuses an entry with no file. It is declared as a noindex PREFIX
      instead, beside /settings, because the (admin) route group contributes nothing to the URL and its
      routes share no prefix. The header is therefore on the live response today, where /analytics is a 404,
      and on the dashboard the day it lands — asserted against the running app.'
    - 'NOTE: the screenshot harness reads the registry through capturePlan() and missingCaptures(), added to
      @berelax/harness/matrix, and the captures are taken in apps/web/src/route-spine.itest.ts: every
      registry document at 3 viewports x 2 themes x 2 directions, 24 PNGs into artifacts/screens/routes,
      each render asserted to be the cell it claims (theme, dir, viewport width) before the shutter, and
      missingCaptures naming any cell that was not taken. Not in scripts/screenshots.mjs, which has no
      server: pnpm critique is one of the cheap gates and must not start depending on a next build — the
      same reasoning scripts/accessibility.mjs records for live routes.'
    - 'NOTE: the RTL acceptance is asserted at /ar for the grid and at /ar/kitchen-sink for the icon. The
      grid assertion places probe elements on the editorial grid''s named lines — the computed
      grid-template-columns lists tracks in logical order and says nothing about mirroring — and shows the
      12rem inline-start column physically to the right of the 20rem one and against the right-hand gutter,
      with the English document as the control. The icon is at /ar/kitchen-sink because that is where the
      spine renders a directional glyph (the locale root has no back link); its computed transform is
      matrix(-1, 0, 0, 1, 0, 0), asserted as a negated horizontal scale with both translation components
      zero, and "none" on the English route.'
    - 'NOTE: canonical and hreflang URLs are absolute and built from SITE_ORIGIN, documented in .env.example
      and falling back to the live domain berelaxmassage.com (docs/13 §5), which the relaunch takes over. It
      is read at render time, so it is fixed at build time for the statically rendered routes: a preview
      deployment must set it before next build or it will announce production URLs as canonical.'
    files:
    - apps/web/src/routes/registry.ts
    - apps/web/src/routes/canonical.ts
    - apps/web/src/routes/alternates.ts
    - apps/web/src/routes/discover.ts
    - apps/web/src/i18n/locales.ts
    - apps/web/proxy.ts
