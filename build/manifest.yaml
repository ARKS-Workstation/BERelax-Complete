    - B-AVAIL-03
    - B-AVAIL-05
    - B-CAT-04
    - F06
    acceptance:
    - The transaction takes SELECT ... FOR UPDATE on every room row it writes, ordered by room id; a test
      inspects pg_locks to confirm the lock is held, and a stress test of two interleaved couples bookings
      on overlapping room sets completes 200 iterations with zero deadlocks
    - 'Two concurrent requests for the last remaining slot: exactly one commits and the other receives a
      named `slot_taken` error, repeated 100 times in an integration test with zero double-bookings and
      zero over-capacity rooms'
    - booking_idempotency has a UNIQUE constraint on the client-supplied key; replaying the same key returns
      the original booking id and creates no second booking, including when the first request is still in
      flight (asserted with a deliberately delayed first transaction)
    - A POST to the public booking endpoint with no idempotency key is rejected with 400 and a named error,
      asserted at the route handler
    - A multi-appointment booking whose second appointment violates a constraint leaves zero booking and
      zero appointment rows, asserted by row counts before and after
    - Each appointment stores gross_price_fils, net_fils, vat_fils and the price_list_id / promotion_id
      that produced them; a subsequent price_list change leaves all five values unchanged
    - 'The appointment insert, the outbox booking.created event and the audit_event commit together: killing
      the worker before it drains leaves the event in pending state and zero messages sent, and draining
      later delivers it exactly once'
