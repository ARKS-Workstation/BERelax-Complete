    - Y2-listing-owner
    provisional: Fake picker seeded with the Al Zahiyah / Al Meena Street fixture listing from docs/13 SS2
      under a LOCATION_GROUP account, plus a decoy Be Relax airport-chain listing so disambiguation is exercised
    acceptance:
    - HTTP 200 with an empty accounts list resolves to the state no_profiles_found, which is asserted to
      be a distinct value from access_not_granted, so a genuinely empty account is never reported as a gating
      error
    - Locations held only under a LOCATION_GROUP account appear in the picker; a fixture where one location
      is returned under both PERSONAL and LOCATION_GROUP yields exactly one picker entry, deduped by placeId
    - A locations.list or locations.get call constructed without readMask is rejected by the adapter before
      reaching the transport, asserted by a unit test on the adapter with a transport spy at zero calls
    - Selecting a GBP location persists resource_ref containing account, location and placeId; a test builds
      the v4 path accounts/{a}/locations/{l}/reviews from the stored ref alone and asserts it is well formed
    - 'Ordering fact, proven: on a connection where every GBP capability returns access_not_granted, the
      gsc capability is selected and verified successfully and its resource_ref.siteUrl is persisted (integration
      test)'
    - Every capability selection writes a google_connection_events row and an audit_event naming the actor
      and the chosen placeId or siteUrl
    - 'NOTE: the picker is a route HANDLER, not the page.tsx this entry''s files list named. W-SITE-01''s
      registry is in exact bijection with the filesystem and requires every *document* to be served in both
      locales, so a page.tsx here would need an Arabic admin document and the admin shell to render it —
      W-SYS-01 — and would join the screenshot, a11y and critique matrices for a screen G-CONN-07 is about to
      replace. apps/web/app/(admin)/settings/integrations/google/picker/route.ts answers JSON instead: GET
      enumerates both halves, POST records one choice, and it is declared in apps/web/src/routes/registry.ts
      as a handler covered by the /settings noindex prefix, exactly like G-CONN-03''s consent route beside
      it. The rendered card that calls it is G-CONN-07''s, and like the consent route this one is NOT
      authenticated until W-SYS-01: its recorded actor says so rather than inventing a user'
    - 'NOTE: withGoogle gained two OPTIONS, both defaulting to the strict answer, and the picker is the only
      caller of either. `resource: ''enumerating''` is the substance: every other consumer must degrade with
      ResourceNotSelected when no resource is chosen, but accounts.list and locations.list are calls against
      the ACCOUNT rather than against a resource, and they are how a resource is chosen — requiring one would
      make the only path out of ResourceNotSelected unreachable. `connectionId` narrows resolution to one
      connection because the picker enumerates under one grant and then writes the selection back to that
      same grant; a resolver free to pick another would offer one account''s listings and persist them under
      another''s, which is how a reply reaches somebody else''s listing. Both are named unions/ids rather than
      booleans so a call site reads as a claim, and neither can widen what a call may see: a disconnected
      connection and one that does not serve the capability still degrade with NotConnected'
    - 'NOTE: one choice fills all three Business Profile capabilities — gbp_reviews, gbp_location and
      gbp_performance — because they are three APIs over one listing. Asking the owner the same question
      three times is three chances to answer differently, and a system whose review replies and consistency
      check point at different listings cannot be reasoned about. So three capability_changed rows are
      written, one per capability, each carrying the same correlationId so a human reads them as one action.
      gsc is deliberately not in that set: that is the third criterion'
    - 'NOTE: a selection writes resource_ref and verified_at and deliberately NOT health. A locations.get
      that succeeded proves the resource resolves; it says nothing about whether the legacy v4 reviews path
      works, and ok means every capability read succeeded, which stays G-CONN-06''s to write (G-CONN-02''s
      NOTE already fixed that boundary). CapabilityResourceWrite cannot express a health, a status or a
      token, and GoogleCapabilitySelectionStore is a third narrow seam beside GoogleConnectionStore and
      GoogleConsentStore for the same reason rewrapRefreshToken is narrow: the picker is a surface an admin
      clicks, which is where "while we are here" changes accumulate'
    - 'NOTE: no migration and no SCHEMA_VERSION change. google_capabilities.resource_ref is already jsonb and
      nullable and verified_at already exists, which is exactly the shape a selection fills — this unit is
      the write that was missing, not a column. The selection addresses the PRIMARY row
      (where connection_id = … and capability = … and is_primary), which is single-valued only because of two
      indexes from 0016, so both are pinned with known-bad fixtures in scripts/test-gates.mjs:
      google_capability_one_primary (a second primary row) and google_capability_resource_unique, the latter
      twice — the same resource twice, and two resource-LESS rows, because NULLS NOT DISTINCT is the half a
      reader skips and a resource-less row is the one a consent leaves for the picker to fill. Plus
      google_connection_events_no_token against a selection payload carrying a token, and three acceptance
      controls: a second non-primary location (0016 models several on purpose), the selection UPDATE itself
      wrapped so the probe fails unless it addressed exactly one row, and the real event payload'
    - 'NOTE: the token allow-list was NOT widened, and a new case pins it for the four modules this unit
      added. The picker is a consumer: it obtains its token from withGoogle, names no accessor and never
      imports token-store.ts, so pnpm chokepoint still reports five modules. The pin also asserts the four
      modules EXIST, because an absence check passes trivially once a file is renamed'
    - 'NOTE: a defect in existing code, found by this unit''s own control and fixed here. The Search Console
      verification first ran INSIDE the withGoogle body, and withGoogle classifies anything thrown in the
      body through the Google taxonomy — so *our* refusal ("this account is listed on the property but not
      verified on it") came back as TransientUpstream with its reason code discarded, and wrote a
      health_check_failed row onto the owner''s connection dashboard for something Google had not done. The
      I/O now runs inside the chokepoint and the decision about what came back runs outside it:
      assertSiteSelectable is pure. A test asserts the refusal writes NEITHER ledger, which is what would
      have caught it. The same shape applies to any future validation inside a body'
    - 'NOTE: the fakes gained what the picker needs and could not be tested without — accounts.list,
      locations.list, locations.get and sites.list, plus configurable accounts, a per-account location map and
      a site list. Three fixture facts are load-bearing: the Al Zahiyah listing (docs/13 §2) sits under a
      LOCATION_GROUP account and NOT under the PERSONAL one, so enumerating only the personal account returns
      the DECOY — an unrelated airport spa also called Be Relax — rather than nothing, which is the dangerous
      failure and the control the LOCATION_GROUP criterion is paired with; the fake refuses a maskless
      locations.list the way Google does, so the adapter''s guard is not the only thing standing in the way;
