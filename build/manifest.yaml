      account and returns no data, so selecting it would produce an SEO report of zeroes that reads as a
      collapse in traffic. placeIds are visibly fixtures (ChIJ-fake-…) rather than plausible, per the
      brief''s rule 15. Every addition is additive and every existing caller still compiles'
    - 'NOTE deferred to G-CONN-06: nothing here compares the returned title and postal address against an
      owner-confirmed snapshot. A selection re-reads the chosen location and refuses if the placeId that
      comes back is not the one on the screen — a listing merged or moved between the enumeration and the
      click — but listing-drift detection over title and address is that unit''s acceptance line and its
      finding, and duplicating it here would produce two answers to one question'
