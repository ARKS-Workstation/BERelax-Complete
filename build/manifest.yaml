  - id: B-CAT-04
    order: 25
    title: Price resolution chain and effective-dated price lists
    summary: The pure price resolver in packages/core applying base gross -> variant -> effective-dated
      price list -> promotion, returning a snapshot-ready object that names which rule produced the number.
      price_list rows are effective-dated with an exclusion constraint preventing overlap.
    owner: claude
    status: done
    size: M
    depends_on:
    - B-CAT-03
    - F05
    acceptance:
    - resolvePrice() applies base -> variant -> price_list -> promotion in that order; a table-driven test
      covers all 16 presence/absence combinations of the four layers and asserts the exact resulting fils
      value
    - price_list carries a daterange validity with EXCLUDE USING gist preventing two overlapping rows for
      the same service_variant; an overlapping insert is rejected against real Postgres
    - A price_list row effective tomorrow does not change today's resolved price, asserted with the F05
      frozen clock at 23:59 and again at 00:01 on the effective date
    - gross -> net/VAT at 5% round-trips exactly in fils for all 32 catalogue prices as literal cases, plus
      a property-based range over 1..10_000_000 fils with zero rounding drift
    - The returned object carries price_list_id and promotion_id (nullable) so any snapshot is explainable;
      a test asserts these are populated when those layers applied and null when they did not
    - 'resolvePrice is pure and deterministic: dependency-cruiser proves packages/core/src/pricing imports
      no db or I/O module, and the same input returns a byte-identical result across 1000 calls'
    - 'NOTE: all 16 presence/absence combinations are enumerated and 14 of them assert an exact fils
      value. The other 2 - the ones where base, variant and price_list are all absent - assert the named
      `no_applicable_price` error instead, because there is no price to state. Zero is not available as
      an answer: B-CAT-03 settled that zero is a MISSING price rather than a free treatment, and a zero
      reaching a booking would invoice as 0.00 and reconcile to nothing. The three "price on request"
      items of docs/13 section 4 are a catalogue state B-CAT-06 models, not a figure this resolver may
      invent. A control asserts the other 14 do not throw, so "it threw" cannot pass for all 16.'
    - 'NOTE: no `promotion` table exists and NO unit in this manifest owns one - this is a gap, not a
      deferral by B-CAT-04. The promotion layer is therefore data the caller supplies (kind, value,
      validity window) and `promotion_id` is carried through to the resolved object untyped by any
      foreign key. B-AVAIL-06 stores that id on the appointment, so whichever unit introduces
      promotions must add the table and the FK; until then a promotion id references nothing.'
    - 'NOTE: the 32 catalogue prices ARE in docs/13 section 4, so that acceptance line is satisfied in
      full as 32 literal cases in packages/core/src/pricing/resolve-price.test.ts - transcribed by hand
      from the document rather than generated, because a generated expectation proves only that the
      formula equals itself. Nothing is seeded: the 32 service_variant rows remain B-CAT-06`s and 0025
      seeds no price_list rows either, so every database probe here creates its own variant inside a
      rolled-back transaction.'
    - 'NOTE: the effective date is the CALENDAR date in Asia/Dubai, deliberately not the trading date
      from `businessDayFor`. Trading runs 11:00-02:00, so the trading date at 00:01 is still yesterday -
      but a customer looking at the site at 00:01 on the effective date sees the new menu, and pricing
      their booking from yesterday`s trading day would quote a price the site no longer shows. The
      resolver takes the date as an argument so the choice is the caller`s and visible; the 23:59/00:01
      pair asserts it, and the acceptance line itself pins the calendar reading by naming 00:01.'
