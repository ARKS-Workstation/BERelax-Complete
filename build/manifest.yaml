      counter that stays at its prior value, and the run is recorded with outcome ''stopped_by_kill_switch''
      rather than an error'
    - 'Per-run budget cap: a run whose recorded LLM cost exceeds the configured cap aborts mid-run, persists
      the partial cost as integer fils, and does not set last_success_at'
    - 'Known-bad fixture per ADR 0003: scripts/test-gates.mjs registers a cron job with no agent_definition
      row and asserts the registry gate fails by name, then removes the fixture in a finally block'
