  - id: B-AVAIL-02
    order: 21
    title: 'The pure availability solver: trading window, duration, turnaround, buffers, lead and advance'
    summary: The core of the project. A pure packages/core solver that, given injected shifts, appointments,
      blocks, closures and the business day, generates candidate slots satisfying the window, duration-plus-turnaround,
      therapist-buffer, minimum-lead and maximum-advance constraints. Turnaround occupies the room; buffer
      occupies the therapist; they are never conflated. No slot table is ever materialised.
    owner: claude
    status: done
    size: L
    depends_on:
    - B-CAT-01
    - B-CAT-03
    - F05
    blocked_on_owner:
    - Y9-turnaround
    - Y9-buffer
    - Y9-lead
    provisional: 20 min standard / 30 min wet-room turnaround, 10 min therapist buffer each side, 2h minimum
      lead time, 90-day maximum advance window. All four are F09 settings flagged provisional:true.
    acceptance:
    - 'Property-based test over at least 10,000 generated cases: no returned slot satisfies start + duration
      + turnaround > business_day.closes_at, and no returned slot''s therapist interval (start - buffer,
      end + buffer) overlaps an existing appointment, block or shift gap'
    - 'Worked examples asserted to the minute: a 120-minute Arabic massage with 20-minute turnaround on
      an 11:00-02:00 day has last bookable start 23:40; the same duration in the wet room with 30-minute
      turnaround has last bookable start 23:30'
    - A 45-minute treatment starting 01:00 with 20-minute turnaround is offered; any positive-duration treatment
      starting 01:55 is never offered; a booking whose treatment ends exactly at 02:00 with zero turnaround
      configured is offered, proving the boundary is inclusive of close
    - 'Turnaround and buffer are proven distinct resources: for one appointment the test asserts room-busy
      = [start, end + turnaround) and therapist-busy = [start - buffer, end + buffer), and swapping the
      two configured values changes which resource reports a conflict'
    - Slots inside a premises_closure are absent, and a closure beginning mid-treatment removes that slot
      rather than truncating it
    - 'Lead and advance boundaries are exact: now + 2h - 1min is excluded, now + 2h is included, day 90
      is included and day 91 is excluded, all under the frozen clock'
    - A schema assertion proves no precomputed slot or availability_cache table exists in the migrations,
      enforcing compute-on-demand
    - 'NOTE: scoped, not satisfied as written — the third acceptance line''s "45-minute treatment starting
      01:00 with 20-minute turnaround is offered" is arithmetically impossible on an 11:00-02:00 day:
      01:00 + 45 + 20 = 02:05, five minutes past close, which the first acceptance line forbids outright
      ("start + duration + turnaround > closes_at") and from which the second line''s 23:40 figure is
      derived. Implemented and asserted instead: 01:00 is offered for a 45-minute treatment with any
      turnaround up to 15 minutes (01:00 + 45 + 15 = 02:00 exactly, the inclusive close), and with a
      20-minute turnaround the last start is 00:55. The 01:55, 02:00-exact, 23:40 and 23:30 figures all
      hold as written. If the owner rules that room turnaround may run past close, the single rule to
      change is the latestStartIn call in candidateStarts (Y9-turnaround).'
    - 'NOTE: the therapist interval is checked against existing appointments and shift gaps only.
      resource_block (0012_rooms.sql) is room-scoped, so blocks are checked against the room interval;
      therapist unavailability from approved leave and expired mandatory credentials is deferred to
      B-AVAIL-04, which narrows the therapistIds handed to this solver rather than adding a second source
      of truth here. Shifts, appointments, rooms, blocks and closures are injected as packages/core types
      because packages/core is pure; B-AVAIL-01 and B-AVAIL-04 add the tables and repositories that fill
      them, and B-AVAIL-03 turns availableRoomIds/availableTherapistIds into a concrete (therapists[],
      room) tuple.'
    files:
    - packages/core/src/availability/solve.ts
    - packages/core/src/availability/intervals.ts
    - packages/core/src/availability/solve.property.test.ts
    - packages/core/src/availability/solve.worked.test.ts
  - id: B-AVAIL-03
    order: 22
    title: Resource-shape assignment for the three real shapes
    summary: 'The assignment layer that turns a candidate slot into a concrete (therapists[], room) tuple
      for the three shapes this business actually sells: Couple Massage (2 therapists, capacity-2 room,
      2 clients), Four Hands (2 therapists, 1 standard room, 1 client) and Morocco Bath (1 therapist, the
      single wet room). All-or-none, and deterministic so seeds and screenshots stay diffable.'
    owner: claude
    status: done
    size: M
    depends_on:
    - B-AVAIL-02
    - B-CAT-02
    acceptance:
    - Couple Massage returns a slot only when 2 eligible therapists and a room with capacity >= 2 and remaining
      capacity >= 2 are simultaneously free; removing either therapist, or occupying one of the two couples-room
      places, removes the slot — three separate assertions
    - 'Four Hands returns a slot only with 2 eligible therapists sharing one standard room, and a deterministic
      preference order asserted: when both a standard room and the capacity-2 room are free it selects the
      standard room, preserving couples capacity'
    - Morocco Bath returns zero slots for both Asian and Arabic variants at all four durations while the
      single wet room is occupied, and returns slots when it is free — asserted as 8 cases plus 8 negations
    - 'Property-based test over randomised therapist pools: a shape requiring 2 therapists never returns
      a partial assignment (assignments.length is always 0 or exactly therapists_required)'
    - A service whose duration exceeds every room's longest free window returns zero slots rather than a
      truncated or best-effort slot
    - 'Assignment is deterministic: 1000 repeat runs on identical input select the same therapist ids and
      room id in the same order'
    - 'NOTE: scoped, and it is the one line here the shipped schema does not allow as written. Four Hands is
      "2 therapists, 1 standard room, 1 client" (docs/13 section 4) and 0017 seeds min_room_capacity 1 for
      it, correctly - there is one client. But 0024 stores one appointment ROW per therapist and its
      deferred trigger counts ROWS against rooms.capacity, so two therapists in one room is a peak of 2 and
      in any capacity-1 room the second row is refused at COMMIT with room_over_capacity. Verified against
      real PostgreSQL and kept as the first known-bad fixture of gate 26q in scripts/test-gates.mjs. Every
      standard room 0012 seeds is capacity 1, so against the seeded inventory Four Hands is assignable to no
      room at all and this unit returns zero slots for it rather than a slot the booking transaction cannot
      commit: a shape the database will refuse is not an assignment. The rule in core is roomPlacesRequired
      = max(min_room_capacity, therapists_required), carried on every assignment as placesUsed, and the
      client count stays a separate rule with its own name (the solver''s `clients`, which is what
      bookableRoomsFor answers). The acceptance line is satisfied against a capacity-2 STANDARD room -
      capacity is data, not a schema change, exactly as 0012 says a second couples room with three plinths
      is - and the capacity-1 case is asserted as the refusal it is. Resolving it properly is not this
      unit''s: either B-CAT-06''s measured inventory includes a two-place standard room, or the capacity
      count moves off "appointment rows" onto a per-booking places figure, which is a migration and belongs
      with the booking transaction of B-AVAIL-06. Tracked under Y8-rooms.'
    - 'NOTE: the deterministic preference order is ROOM_TYPE_PREFERENCE - standard before couples before wet,
      then the smallest room of that rank, then the id - held as a Record over the room_type union so a
      fourth room type is a compile error rather than an unranked room. "When both a standard room and the
      capacity-2 room are free it selects the standard room" is asserted twice, because under the seeded
      required_room_type = standard the room TYPE filter alone satisfies it and the ranking could be
      reversed, absent or dead while the test reported PASS. The second assertion clears required_room_type
      - the column is nullable, so an admin can - leaving the ranking as the only thing choosing, and a
      third control reverses the input room order and asserts the answer does not move, which is what
      distinguishes a ranking from "whatever the repository returned first". bookableRoomsFor deliberately
      does not sort and says so in its own comment; this is the module it defers that policy to.'
    - 'NOTE: the 8 Morocco Bath cases are (2 styles x 4 durations), each asserting the positive and its
      negation, and what differs per style is the eligible therapist pool rather than anything about the
      room. Style is an attribute of the treatment that maps to a required SKILL and never to a room or a
      price (ADR 0021), so it reaches this layer only through the pool B-AVAIL-04 hands over - that a style
      cannot change the room assignment is the claim rather than an omission, because if it could then
      reassigning a therapist would move the booking. The wet room is occupied by an appointment held by a
      therapist outside every pool, so the room is taken without a therapist also being taken, and a ninth
      case asserts that with every dry room free and the wet room absent the answer is zero slots rather
      than a substitute.'
    - 'NOTE: "remaining capacity >= 2" is a real rule here and is asserted directly on assignShape rather
      than only end to end, because B-AVAIL-02''s roomsFreeFor is STRICTER than the database: it drops a
      room with any overlapping room occupancy at all, so by the time a slot reaches this layer remaining
      capacity is either 0 or the whole capacity and the half-occupied couples room would pass vacuously.
      remainingRoomPlaces mirrors the SQL room_peak_concurrency of 0024 - a peak measured over the stored
      treatment periods, never a total and never "how many overlap this one" - and a control asserts that
      one free place of two is still enough for a one-place footprint, which is the assertion the stricter
      solver rule cannot make. Whether the solver should offer a partially-occupied capacity-2 room at all
      is B-AVAIL-02''s to change, and its property-test oracle currently requires the strict reading, so it
      is left alone and recorded here instead.'
    files:
    - packages/core/src/availability/assign-shape.ts
    - packages/core/src/availability/assign-shape.test.ts
    - packages/core/src/availability/assign-shape.property.test.ts
  - id: B-AVAIL-04
    order: 23
    title: Therapist availability read model and the eligibility port P-HR later fills
    summary: The availability-side contract for staff. Minimal employee, employee_skill, shift, shift_assignment
      and employee_document (type, expiry) tables plus a TherapistEligibilityProvider port in packages/core
      with a db-backed implementation. Approved leave and expired mandatory credentials remove a therapist
      from bookable availability here, so P-HR extends these tables rather than inventing a second source
      of truth.
    owner: claude
    status: done
    size: M
    depends_on:
    - B-AVAIL-01
    - B-CAT-02
    blocked_on_owner:
    - Y8-staff
    provisional: 19 unnamed therapists, style skills split evenly across asian/arabic, genders assigned
      across the fixture, no expired credentials in the happy-path fixture and one deliberately expired
      credential in the negative fixture.
    acceptance:
    - employee, employee_skill, shift, shift_assignment, employee_document and an approved-leave view exist
      with the columns availability reads; a type-level test pins the TherapistEligibilityProvider signature
      so a P-HR extension that changes it fails typecheck
    - A shift ending mid-treatment removes the slot whose treatment plus buffer would run past shift end,
      asserted as a worked example (shift ends 22:00, 90-minute treatment at 21:00 excluded, at 20:20 included)
    - A therapist holding an employee_document of a mandatory type with expiry < slot start is excluded;
      the same therapist with expiry after slot start is included — two assertions on the same fixture therapist
    - 'Which document types count as mandatory is read from regulatory_profile, not a hard-coded list: flipping
      the profile in a test changes which therapists are excluded'
    - A therapist with approved leave overlapping the slot is excluded; a leave request in pending state
      does not exclude them
    - dependency-cruiser proves packages/core holds only the port and packages/db holds the implementation,
      with no core -> db import
    - 'NOTE: the concrete names this list left open. The migration is
      packages/db/migrations/0030_staff_availability.sql and SCHEMA_VERSION is 30. The db-backed suite is
      eligibility.itest.ts, NOT .test.ts - packages/db has no database in the unit runner, so a
      database-backed suite there never connects, the same correction B-AVAIL-01 made for
      booking-constraints and B-LIFE-02 for otp. eligibility.test.ts exists as well and holds the half
      that needs no database (the reason-name translation, which refuses an unknown reason rather than
      passing it through as undefined). The pair - core''s pure rule against the SQL implementation - is
      packages/fixtures/src/therapist-eligibility.itest.ts, because packages/fixtures is the only package
      that may import both. Three tables the list did not name were needed and are here: leave_request
      (the approved-leave view is a projection of it, and the view is what availability reads),
      employee_skill''s is_provisional/open_question_id pair, and the regulatory_profile column below.'
    - 'NOTE: the credential rule shipped is STRICTER than the acceptance line, deliberately, and two
      boundaries in it are decisions rather than details. (1) A mandatory document type with NO row at all
      is credential_missing, not a pass: a therapist whose file was never completed is not more eligible
      than one whose licence lapsed yesterday, and the permissive reading makes the two
      indistinguishable - the same fail-closed argument 0012 makes for service_room_type_compat
      ("structural absence is a loud failure; a fall-back is a quiet one"). (2) Expiry is compared to the
      TRADING date, inclusively, and never to the slot instant. 01:30 belongs to the previous trading
      date, so a licence valid through the 18th covers the 18th''s 01:30 appointment whose calendar date
      is the 19th; comparing against lower(period)::date takes the last two hours of every trading day
      away from a therapist licensed for all of them. Employment is compared the same way, which is also
      why employee carries an employment PERIOD rather than an is_active flag - a flag answers "now" and
      availability is asked about past and future dates. (3) The latest expiry per (employee, type) is
      what counts, because a renewal is a new row rather than an edit; reading any other row reports a
      therapist as expired on the strength of a licence they have already replaced.'
    - 'NOTE: regulatory_profile gained mandatory_therapist_document_types, an employee_document_type[]
      with a default rather than a superseding row - introducing a column is not a change to the profile,
      and superseding the seeded row to carry it would record a decision nobody took. The default IS the
      provisional answer (professional_licence + health_certificate), which is the stricter reading 0004
      says an unconfirmed licence resolves to, and it is carried by the profile''s own is_provisional
      against Y1-licence and Y8-staff. An enum array and not text[]: a typo in a text[] is a mandatory
      type nothing matches, so every therapist passes the check meant to exclude them. One consequence
      cost a run to find and is recorded here for the next unit that adds a column to that table:
      regulatory_profile_current was created in 0004 as `select *`, and a view''s column list is FIXED at
      CREATE time, so the column was invisible to every consumer until 0030 re-issued the view with
      create or replace.'
    - 'NOTE: scoped where a dependency does not exist yet. (1) appointment.therapist_id still has NO
      foreign key, although its parent now exists. `references employee (id)` is the constraint that
      fits and it is not the claim worth making: employee holds every employee, so it would accept a
      receptionist as the therapist of a massage while reading as though it had proved otherwise. The
      claim is "an employee holding the skill this appointment''s style requires, on shift, not on leave,
      credentialled", which is this read model re-applied inside the booking transaction - B-AVAIL-06''s.
      Attaching the weaker constraint now would also require three integration suites and gate 26q to
      invent an employment record for a synthetic uuid. (2) appointment snapshots neither
      turnaround_minutes nor therapist_buffer_minutes, so readCommittedAppointments re-derives both from
      service and service_resource_shape at today''s figures. solve.ts states the opposite ("both figures
      are snapshotted onto the appointment when it is booked") and the columns are not there to read;
      adding them belongs with the transaction that would write them, B-AVAIL-06. The error is uniform
      across appointments rather than selective, so it cannot produce a double booking. (3) Gender is
      read, carried on every pooled therapist and deliberately NOT applied: same-gender matching is
      B-AVAIL-05''s rule. employee.gender is NULLABLE, because a NOT NULL would have this migration
      invent nineteen people''s genders (Y8-staff), and the port omits the key rather than answering
      null so that B-AVAIL-05 has one spelling of "unknown" to handle.'
    - 'NOTE: the "19 unnamed therapists" provisional roster is NOT seeded, and that is a departure from
      this entry''s own provisional line. 0012 seeds five provisional rooms because a room is premises
      data; an employee row is an employment record, and nineteen fabricated ones in every database is
      brief rule 15 in its worst form - a fabricated person can be rostered, paid and reported on, and
      P-HR''s import would then be the second source for the same nineteen people. An empty employee
      table means availability offers nothing until HR data exists, which is the loud failure rather than
      the quiet one. The fixture salon''s eight therapists (packages/fixtures/src/salon.ts, digest-locked)
      remain the dataset; the two integration suites build the small, purpose-named probe rosters their
      assertions need, including the deliberately expired credential. Skills are split across both styles
      and genders assigned across those probe employees, which is what the provisional line describes.'
    - 'NOTE: a defect found in shipped code, worked around here rather than fixed here.
      assign-shape.ts''s roomPlacesTaken counts ScheduledAppointment RECORDS, while the SQL it says it
      mirrors (room_peak_concurrency, 0024) counts appointment ROWS - and 0024 writes one row per
      therapist. A Four Hands already committed in a capacity-2 room is therefore 2 rows and 2 places to
      the database and 1 place to core if the two rows are merged into one record with two therapistIds,
      which is the reading ScheduledAppointment.therapistIds'' own comment invites ("two for Four Hands
      and Couple Massage"). remainingRoomPlaces then reports a free place the deferred trigger refuses at
      COMMIT. It is unreachable through assignShapeSlots, because roomsFreeFor is stricter and drops the
      room first (B-AVAIL-03''s own NOTE), but it IS reachable through the direct assignShape call
      B-AVAIL-06 makes inside the booking transaction. readCommittedAppointments therefore returns ONE
      record per appointment row, which is the unit the trigger counts, and eligibility.itest.ts asserts
      that shape. Resolving it properly - either the comment or the counting rule - is B-AVAIL-03''s or
      B-AVAIL-06''s.'
    - 'NOTE: what P-HR must supply to fill the port, stated as the seam rather than as a schema.
      EligibilityFacts in packages/core/src/availability/eligibility-port.ts is the contract written as a
      type: per therapist an employment period, the skills held, the credentials with their expiry dates;
      plus the rostered spans for a trading date, the APPROVED leave periods, and the mandatory document
      types. P-HR extends employee, employee_skill, shift, shift_assignment, leave_request and
      employee_document rather than introducing its own tables, and replaces
      readEligibleTherapists''s query or the provider wiring - not solveAvailability, which this unit does
      not touch. The division that must not be blurred: day-level facts are the port''s and interval
      arithmetic is the solver''s, which is why approved leave is subtracted into the shifts the port
      returns (poolSolverInput) rather than added as a second input the solver would have to reconcile.'
    files:
    - packages/core/src/availability/eligibility-port.ts
    - packages/core/src/availability/eligibility-port.test.ts
    - packages/db/migrations/0030_staff_availability.sql
    - packages/db/src/schema/staff.ts
    - packages/db/src/repositories/eligibility.ts
    - packages/db/src/repositories/eligibility.test.ts
    - packages/db/src/repositories/eligibility.itest.ts
    - packages/fixtures/src/therapist-eligibility.itest.ts
  - id: B-AVAIL-05
    order: 24
    title: Gender matching as a hard constraint, default strict
    summary: 'Same-gender matching is a hard constraint inside the solver, defaulting to strict with no
      configuration required, and downgradable to advisory only as an owner-role audited settings change.
      Fail-safe: an unreadable or missing setting resolves to strict.'
    owner: claude
    status: done
    size: M
    depends_on:
    - B-AVAIL-04
    - F09
    blocked_on_owner:
    - Y9-gender
    provisional: Strict same-gender matching, enforced. docs/13 §5 notes the site's 'ladies' therapists
      on request' copy suggests request-based matching, which contradicts strict; strict is kept as the
      strictest safe option until ADDED / Abu Dhabi Municipality confirm in writing.
    acceptance:
    - With no setting row present, a property-based test over randomised client and therapist genders returns
      zero cross-gender assignments across at least 5,000 cases
    - The setting availability.gender_matching accepts only 'strict' | 'advisory'; deleting the row, or
      corrupting it to an unparseable value, resolves to 'strict' — both asserted rather than throwing
    - Switching to 'advisory' requires the owner role (refused for manager and receptionist), writes an
      audit_event with before/after and a required reason string, and is returned by the Unconfirmed Assumptions
      query as provisional
    - 'In ''advisory'' mode cross-gender slots are returned with gender_mismatch: true present on every
      such slot; a test asserts the flag is never undefined or absent on any returned slot in either mode'
    - A booking request whose client gender is unknown returns zero slots and the named reason code `requires_client_gender`
      in strict mode, so the caller can collect it — asserted as a reason code, not an unexplained empty
      list
    - 'The gender constraint is applied inside the solver, not as a post-filter on results: a test injecting
      a solver-internal spy asserts ineligible therapists are never considered for assignment'
    - 'NOTE: the setting this list calls availability.gender_matching is booking.same_gender_matching, the
      one F09 already declares - compliance_locked, owner-only, audited, is_provisional against Y9-gender.
      No second key was added: two keys for one compliance constraint is one constraint plus a future
      disagreement, and the new one would be neither seeded nor compliance-locked. Its schema was NARROWED
      to exactly strict | advisory, which the line asks for: it accepted a third value ''off'' until this
      unit, and ADR 0020 and docs/01 decision 19 both permit relaxing this rule to advisory and nothing
      further, so a stored value that switches it off entirely is a compliance position no document
      supports. A row an older build left at ''off'' now READS as strict rather than failing validation on
      the read path, which is the only safe direction for a value that has stopped being a legal one.'
    - 'NOTE: where the code is, and why it is not all in one file. The two modes, the setting key and the
      total normaliser genderMatchingMode are in packages/shared/src/gender-matching.ts, because
      @berelax/config (the registry''s z.enum), @berelax/db (the SQL) and @berelax/core (the rule) all read
      that vocabulary and none of the three may import another - the same argument that puts TherapistSkill
      there. The per-therapist verdict (genderVerdict, sameGenderMatch) is in eligibility-port.ts beside
      the other verdicts, because resolveTherapistPool has to apply it to stay in step with the SQL and a
      port importing gender-match.ts - which imports the port - is a cycle pnpm boundaries rejects.
      gender-match.ts owns the rest: the pool narrowing, the request-level refusal, the slot label and the
      solver wiring.'
    - 'NOTE: gender_mismatch is the SEVENTH EligibilityExclusionReason and it is applied LAST, in both
      implementations. Last is a decision: it is the only reason that is useful because everything else
      passed ("no female therapist is free at 20:00" is actionable, "the therapist who left in March is
      the wrong gender for you" is not), and reporting it for a therapist who is excluded anyway would
      disclose a person''s recorded gender to a caller with no use for it. The order is asserted on both
      sides and the two reason lists are now pinned to each other in
      packages/fixtures/src/therapist-eligibility.itest.ts - at runtime for the order, and at compile time
      for the membership, so a reason added to one side only fails pnpm typecheck rather than a booking.
      Until this unit the only thing holding those two lists together was a comment in each.'
    - 'NOTE: the slot flag is spelled genderMismatch, not gender_mismatch. camelCase in TypeScript and
      snake_case in SQL is the convention every other field in the solver follows (turnaroundMinutes,
      therapistBufferMinutes), and two spellings of one field is the drift this repository keeps paying
      for. It is a REQUIRED boolean on every returned slot in both modes - never optional, because an
      absent flag reads as undefined, undefined is falsy, and a cross-gender slot would then present as a
      compliant one. false is a claim that needs evidence on both sides of the pair; true needs none, so
      an unknown client gender under advisory flags every slot. crossGenderTherapistIds names the
      therapists who were free but not proved a match, and is empty in strict mode always.'
    - 'NOTE: the customer''s gender is a different question from the therapist''s and is read in a
      different place. The therapist''s is employee.gender (nullable, Y8-staff). The customer''s is on NO
      table - customer has no gender column, this unit added none, and inventing one would be a field the
      front desk fills in with a guess - so it is an argument supplied by the booking request. At a phone
      booking it is very often unknown, and strict matching then returns ZERO slots with the reason code
      requires_client_gender, before any start is considered: no windows and no rejected starts either,
      because a list of rejections would say the day had been examined and found full. The field is a
      REQUIRED key with a possibly-undefined value on GenderMatchedRequest, so "we did not collect it" has
      to be written out at the call site. On refusal the narrowed pool is emptied as well as flagged: a
      refusal a caller can ignore is a refusal somebody books through.'
    - 'NOTE: an unknown THERAPIST gender is a mismatch, not a wildcard, and the consequence is deliberate.
      sameGenderMatch is a claim about a pair and a pair with a hole in it cannot be claimed, so under
      strict matching a database with no HR data offers NOBODY - which is the loud failure rather than the
      quiet one, and the same argument 0030 makes for not seeding nineteen fabricated people. The fixture
      salon''s eight therapists and the two integration suites'' probe rosters carry genders; production
      availability appears once P-HR''s import fills employee.gender.'
    - 'NOTE: scoped, and left strict, because Y9-gender is open. (1) ROOM gender zoning is not modelled.
      docs/04 section 3 says "Room gender zoning is modelled alongside it" and rooms carry no gender
      attribute - 0012 has none and this unit invented none, because which rooms are zoned for whom is a
      premises fact nobody has stated. (2) A Couple Massage has TWO clients and the request carries one
      gender, so the strict reading applied is that every therapist assigned must match that single
      supplied gender; a per-client gender for a couple booking is unresolved and belongs with the booking
      transaction, B-AVAIL-06. (3) Under advisory, a slot is offered with the same-gender therapists
      whenever any are free, so a two-therapist shape that would need a MIXED pair is not offered by
      default - its ids are named in crossGenderTherapistIds and choosing them deliberately is
      B-AVAIL-06''s. All three are stricter than the relaxed reading, which is the direction 0004 says an
      unconfirmed licence question resolves in.'
    - 'NOTE: how the Unconfirmed Assumptions line is satisfied, which needed a reading. provisionalSettings()
      (the registry) keeps listing booking.same_gender_matching under Y9-gender after an advisory switch,
      because the assumption is a property of the declaration and does not stop existing when a row
      changes. The DATABASE panel (unconfirmedAssumptions) does empty, because writeSetting clears
      is_provisional when a human confirms a value - "that is the whole point of the Unconfirmed
      Assumptions panel", and for a compliance_locked key the required justification IS the confirmation.
      Both directions are asserted in packages/db/src/settings/availability.itest.ts. Changing
      writeSetting so a compliance_locked key stays provisional after a justified change would be F09''s
      decision, not this unit''s.'
    - 'NOTE: a defect found in shipped code, recorded rather than fixed. app_setting_history.justification
      is ALWAYS NULL. writeSetting annotates the newest history row with `update app_setting_history set
      justification = ...`, and 0010 creates `app_setting_history_no_update ... do instead nothing`, so the
      statement succeeds affecting zero rows and the `.catch(() => undefined)` beside it never fires. The
      reason a compliance-locked change carries is therefore recorded only in audit_event.after_state,
      which is where this unit asserts it (before and after, plus the required reason string). Fixing it
      means either a different write path that inserts the history row itself or a trigger change, i.e. a
      migration, so it is out of scope here; whichever unit takes it should note that the column has read
      NULL for every settings change ever made.'
    - 'NOTE: no migration, and SCHEMA_VERSION is unchanged at 32. Worth recording because 0010 creates
      app_setting and app_setting_history and seeds NO rows - the values come from seedSettingDefaults
      reading the registry at boot. "A database with no app_setting row at all" is therefore the ordinary
      state of a freshly migrated database rather than a contrived one, which is why the strict default is
      proved there: packages/db/src/settings/availability.itest.ts empties the table inside a rolled-back
      transaction and reads strict, and packages/fixtures/src/therapist-eligibility.itest.ts does the same
