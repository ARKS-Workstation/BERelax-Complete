  - id: M-VAT-01
    order: 56
    title: Suppliers, supplier tax profile, bills and payables
    summary: supplier with supplier_tax_profile carrying explicit residency and place-of-supply rule, bill
      and bill_line with immutable per-line tax treatment, our own gapless internal reference alongside
      the supplier's, and payables aging.
    owner: claude
    status: done
    size: M
    depends_on:
    - M-TILL-02
    - M-TILL-03
    acceptance:
    - a schema test fails if supplier_tax_profile.residency is nullable or carries a default; every seeded
      supplier has an explicit domestic or offshore value
    - a bill posts Dr expense (net) Dr recoverable input VAT (vat) Cr payables (gross) and balances to the
      fils for every seeded bill shape
    - a duplicate (supplier_id, supplier_reference) is rejected by a unique constraint, proven by a failing
      second insert
    - payables aging buckets current/30/60/90+ computed from due_date against the frozen clock match a committed
      worked example exactly
    - a bill dated inside a locked period is refused with PeriodLocked and writes nothing
    - each bill_line's tax treatment is stored on the line and the application role holds no UPDATE grant
      on bill_line, asserted from information_schema
    - 'NOTE: the aging has FIVE buckets where this list names four. current, 1-30, 31-60 and 90+ are all
      present and each means literally what it says; 61-90 was added because a bucket labelled "90+" that
      actually holds a 75-day payable misstates the oldest debt in the business, which is the one figure
      an aging report is opened for. Collapsing 61-90 into 90+ stays available to a report; a bucket that
      lies does not.'
    - 'NOTE: "outstanding" is the full gross of every posted bill, because nothing can be paid yet — no
      unit before this one builds a supplier payment or settlement table. When one lands it is an
      allocation row pointing at the bill (never an UPDATE, which the append-only triggers refuse) and the
      aging query becomes gross_fils - coalesce(allocated, 0): a join, not a redesign. Deferred to
      whichever unit adds supplier payments.'
    - 'NOTE: two tax treatments are deliberately ABSENT from bill_line.tax_treatment rather than declared
      and unimplemented — blocked input VAT (M-VAT-02) and the imported-services reverse charge
      (M-VAT-03). Each needs posting behaviour this unit does not have, and a value the schema accepts but
      no code path posts correctly would record a bill that looks complete and understates the return. So
      postBill refuses a bill from an offshore supplier whose place-of-supply rule is
      imported_services_reverse_charge, naming M-VAT-03, and adding the treatment is a migration there.'
    - 'NOTE: our own bill series resets NEVER, unlike the three statutory ranges in 0013. document_series
      holds one counter and one period_key per series, so under the annual policy a document dated in the
      earlier period that arrives AFTER one dated in the later period restarts the earlier range and
      re-issues a number already used. For an invoice that is hypothetical — we issue them in date order.
      For a purchase bill it is the normal case: last December''s invoice arrives in January. Found by
      bill_internal_number_unique refusing the second BILL-2026-00001 in the integration suite. An
      unbroken range costs nothing for an internal reference, so BILL-00001 it is.'
    - 'NOTE: no DOMESTIC supplier is seeded. The real list — landlord, utilities, laundry, consumables —
      is an H-MIG import (no Y8 question covers it), and a seeded placeholder would put a company that
      does not exist into the books, where it gets exported and eventually paid. The five offshore vendors
      docs/04 section 4 names (DigitalOcean, Resend, Google, Meta, Anthropic) ARE seeded, because their
      residency is the fact the system must not be able to get wrong. SMSala is omitted: docs/04 says "if
      billed offshore", so its residency is unknown and guessing it is how a supplier ends up domestic by
      default. The domestic paths are exercised by suppliers the tests create.'
    - 'NOTE: two files outside this unit changed, both because the bill joins the existing numbering
      counter rather than getting a second one (ADR 0023): DOCUMENT_SERIES_CODES in
      packages/db/src/repositories/numbering.ts gains SUPP-BILL, and numbering.itest.ts asserted the exact
      set of three series. 0013''s anonymous document_kind CHECK is dropped and re-added by name
      (document_series_document_kind_allowed) so the next unit adding a kind extends it by name.'
    - 'NOTE: bill carries no entry_date. The business day lives on journal_entry.entry_date, resolved by
      the caller with resolveTradingDate, and two copies of the date that decides which VAT period a
      figure lands in is one copy plus a future disagreement. A bill dated in a closed month is posted on
      the business day it was entered, which is what a bookkeeper does; the aging reads the supplier''s due
      date and is unaffected.'
