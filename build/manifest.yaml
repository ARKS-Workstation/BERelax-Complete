  - id: H-HARD-02
    order: 176
    title: Dependency, secret, licence and container scanning in CI
    summary: Four supply-chain gates wired into pnpm verify and CI, each with a known-bad fixture created,
      run and removed in a finally block, and each asserted by name by the CI-completeness check so deleting
      one fails the build.
    owner: claude
    status: done
    size: M
    depends_on:
    - F02
    - H05
    acceptance:
    - a fixture commit containing a realistic API key shape fails the secret scan, and the fixture is removed
      in a finally block
    - a fixture dependency with a known critical advisory fails the audit gate, and every allowlist entry
      is required to carry a dated expiry
    - a copyleft-licensed fixture dependency fails the licence-policy gate
    - the CI-completeness check asserts the workflow invokes all four new gates by name, and removing one
      from the workflow fails the check
    - pnpm verify runs all four scans locally and completes within the declared time budget, asserted by
      the gate harness
    - 'NOTE: container scanning is scoped, because there is no container. Image vulnerability scanning
      — a Trivy or Grype pass over a built image — needs an image, and no Dockerfile exists in this
      repository: apps/worker/Dockerfile belongs to W-SYS-06, which needs ffmpeg in it. Rather than
      invent one, `pnpm container` enforces the half that needs no image, each rule proven to fire by a
      known-bad fixture: every image reference pinned to a non-moving tag, the PostgreSQL major in
      docker-compose.yml and .github/workflows/ci.yml equal to the DigitalOcean Managed Database major
      (16), no undeclared base image, and the Dockerfile rules themselves — base image pinned by
      @sha256 digest, a non-root final USER, no .env copied into a layer, every Dockerfile declared with
      an owner. The deferral cannot be forgotten: the moment apps/worker/Dockerfile exists the gate
      fails with [dockerfile-appeared] until build/container-policy.json is updated, which is the commit
      that must also add the image scan. Deferred to W-SYS-06.'
    - 'NOTE: the dependency audit is split, because `pnpm verify` must not depend on the network. The
      offline half, `pnpm deps`, is in `verify` and in CI: it matches the resolved lockfile graph and
      every workspace manifest against build/advisories.json — a dated, committed snapshot — and
      enforces the allowlist''s own hygiene. The online half, `pnpm audit:online`, is a separate CI step
      running `pnpm audit --audit-level high` against registry.npmjs.org, and is deliberately absent
      from `verify`: a gate that fails offline or behind an agent proxy is a gate that gets commented
      out, and a check nobody runs is indistinguishable from one that does not exist. That makes five
      gates wired into CI rather than four; all five are asserted by name by case 29 of
      scripts/test-gates.mjs.'
    - 'NOTE: the findings against the repository as it stands are recorded, not fixed, per ADR 0002''s
      rule that a deliberately pinned toolchain is not loosened to satisfy a scanner. Licences: one
      copyleft dependency is distributed — @img/sharp-libvips-<platform>, LGPL-3.0-or-later, reached at
      apps/web and apps/worker > packages/media > sharp — accepted in build/licence-policy.json with the
      notice-and-replacement obligation stated, which lands on W-SYS-06''s image. axe-core and
      lightningcss (both MPL-2.0) are build tooling only and are not distributed. Advisories: five, none
      critical or high — GHSA-67mh-4wv8-2f99 (esbuild 0.18.20, pinned beneath @payloadcms/db-postgres >
      drizzle-kit, and the advisory is in a development server this system never starts) and four
      dompurify 3.4.8 advisories reachable only through Payload''s Monaco admin editor. Each carries a
      dated expiry in build/advisory-allowlist.json; a critical advisory cannot be allowlisted at all.
      Credentials: none.'
    - 'NOTE: no migration and no schema change — every gate reads files, pnpm-lock.yaml and the pnpm
      store. SCHEMA_VERSION is untouched.'
    files:
    - scripts/test-gates.mjs
    - .github/workflows/ci.yml
    - scripts/check-licences.mjs
    - scripts/check-secrets.mjs
    - scripts/check-dependencies.mjs
    - scripts/check-container.mjs
    - scripts/lib/dependency-graph.mjs
    - build/advisories.json
    - build/advisory-allowlist.json
    - build/licence-policy.json
    - build/secret-allowlist.json
    - build/container-policy.json
    - package.json
