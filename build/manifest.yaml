  - id: G-CONN-03
    order: 153
    title: 'withGoogle: the single chokepoint, error taxonomy and declared degradation'
    summary: One capability wrapper that resolves the connection and resource, obtains a token, injects
      a correlation id, classifies every upstream error and converts GoogleReauthRequired and AccessNotGranted
      into the consumer's declared degraded mode. The CONSUMERS table from docs/10 SS2 is the only place
      a consumer names what it needs.
    owner: claude
    status: done
    size: M
    depends_on:
    - G-CONN-02
    acceptance:
    - 'Chokepoint rule: a dependency-cruiser rule named google-tokens-only-in-with-google fails when any
      module other than packages/google/src/with-google.ts and token-store.ts references refresh_token_ct,
      access_token_ct or the token-store accessor; scripts/test-gates.mjs writes a violating fixture, asserts
      rejection by rule name, and removes it'
    - 'Table-driven taxonomy test: each fake fault code maps to exactly one named class from {GoogleReauthRequired,
      AccessNotGranted, QuotaZero, RateLimited, ListingNotVerified, AdminPolicyEnforced, TransientUpstream},
      and an unmapped upstream code maps to TransientUpstream rather than being swallowed'
    - 'Declared degradation, not throwing: under access_not_granted withGoogle(''gbp_reviews'') resolves
      to draft_only, withGoogle(''gsc'') resolves to disabled and withGoogle(''gbp_location'') resolves
      to manual_snapshot; a test asserts none of the three throws'
    - 'Token never leaks: a test drives every taxonomy case with a captured logger and Sentry stub, then
      asserts the fixture token string appears in zero log lines at any level, zero error messages, zero
      serialized stack traces and zero breadcrumbs'
    - Every withGoogle call emits structured log lines carrying the same correlation id, capability name
      and connection id, asserted by grouping captured lines by correlation id and requiring exactly one
      group per call
    - 'Every failure that affects a capability writes a row the owner dashboard reads (per docs/10 SS4:
      a pg-boss failure alone is not evidence); a test asserts the dashboard-visible row count increments
      and deliberately fails if only pgboss.job recorded the failure'
    - 'NOTE: the chokepoint is TWO gates, because one cannot express it, and the split is the design.
      dependency-cruiser sees module-to-module edges only: google-tokens-only-in-with-google closes the
      import path to packages/google/src/token-store.ts and nothing else. It cannot see an identifier and
      it cannot see the string refresh_token_ct inside a query, so those live in the new source-scanning
      gate scripts/check-google-token-chokepoint.mjs (pnpm chokepoint) under three named rules:
      google-token-columns-outside-the-token-modules, google-token-accessor-outside-the-token-modules and
      google-token-in-a-template-literal — the last being the rule docs/10 §4 asks for by name. Each of
      the four has a known-bad fixture in scripts/test-gates.mjs asserted by rule name, plus two controls'
    - 'NOTE: the RE-EXPORT loophole the brief pointed at was real and open. packages/google/src/index.ts
      re-exported openToken, sealToken, rewrapToken and connectionBinding, so
      `import { openToken } from ''@berelax/google''` reached the decryption function while naming nothing
      a module rule could match — the same shape as `import { SMSALA } from ''@berelax/providers''`.
      Unlike the providers barrel this one cannot be banned: it is the package entry point the consent
      route legitimately imports. So the accessors were removed from the barrel and only the SealedToken
      TYPE is re-exported, which makes reaching them a tsc error (asserted by name in the gate harness).
      Nothing outside packages/google imported them, so the removal cost nothing'
    - 'NOTE scoped, not satisfied in full: the rule permits FIVE modules, not the two this line names.
      lifecycle.ts (refresh), rewrap.ts (KEK rotation) and oauth/reconnect.ts (the consent write) each
      legitimately hold a plaintext token today, and with-google.ts does not — it obtains its token
      through accessTokenFor. Narrowing to two would mean moving the refresh into with-google.ts, which
      G-CONN-04 immediately moves back out into token-refresh.ts. The rule also exempts type-only imports
      via dependencyTypesNot, because connection-store/memory-store/postgres-store move the five sealed
      columns without ever holding a key, and a rule that condemned the correct code would be relaxed'
    - 'NOTE: NO MIGRATION, and 0028_google_capability_failures.sql was not used. SCHEMA_VERSION stays 21.
      The failure ledger is google_connection_events from 0016, which is already append-only, already
      mirrored into audit_event by a trigger in the same transaction, already refuses a payload carrying
      a token by CHECK, and is already what the connection panel renders. agent_alert from G-AGT-01 was
      the other candidate and is the wrong shape — keyed on agent_key, it answers ''which agent has gone
      silent'', not ''which capability of which connection failed''. A third ledger would only create a
      question about which one to believe. The event name is health_check_failed, the vocabulary 0016''s
      CHECK already permits for an authenticated call that failed; a synonym would have cost a migration'
    - 'NOTE: two failure modes were added to the shared FailureScript — not_verified and
      admin_policy_enforced. Without them ListingNotVerified and AdminPolicyEnforced were reachable only
      by hand-building an error, and a taxonomy class no fake can produce is a class whose handling is
      unproven. Both are documented Google failures (docs/10 §4: a Workspace admin marking a service
      Restricted; the *Listing not verified with Google* state). The conformance suite arms every mode
      against every fake, so this widened that loop rather than needing a change to it'
    - 'NOTE: the taxonomy is one class SHORT of the fake fault codes, and this is docs/10''s gap rather
      than an implementation choice. The seven classes have no member for ''the provider rejected the
      request and will reject it again'', so the fake mode `rejected` maps to TransientUpstream. The
      retry decision therefore travels in details.retryable via isRetryableGoogleError rather than in the
      class name, and a test asserts rejected is classified TransientUpstream AND not retryable, so a
      caller reading the class name as a retry policy is contradicted by the test rather than by a bug'
    - 'NOTE: withGoogle degrades on FIVE classes, not the two docs/10 §4 names. The rule is: a failure
      the next attempt cannot fix degrades, a failure it might fix throws so pg-boss retries with
      backoff. So GoogleReauthRequired and AccessNotGranted (named in §4) plus QuotaZero,
      ListingNotVerified and AdminPolicyEnforced degrade, while RateLimited and TransientUpstream throw —
      degrading a sixty-second rate limit into draft-only mode would cost a day of manual work. DEGRADES
      is a total Record over the class union, so a new class cannot be added without deciding.
      NotConnected and ResourceNotSelected degrade too (docs/10 §6: the fallback IS the launch mode) and
      deliberately write no event row, because there is no connection row to hang one on and the panel
      already renders never_connected from the absence itself'
    - 'NOTE: the fake OAuth provider was recording the PLAINTEXT refresh token in its call-log detail on
      every successful refresh — a log the admin call-log pane renders and the screenshot harness
      photographs. Now a 12-hex-character SHA-256 fingerprint. Found only because the leak detector was
      pointed at the provider call log as well as at the application logger, which is exactly the
      wrong-surface failure the control in that test exists to catch'
    - 'NOTE: withGoogle''s capability parameter is typed DeclaredCapability, derived from the CONSUMERS
      table''s own contents, so withGoogle(''gbp_performance'') is a COMPILE error until a consumer
      declares it — the strongest available form of ''the table is the only place a consumer names what
      it needs''. indexByCapability also refuses two consumers declaring one capability, because the
      degraded mode would otherwise resolve by object enumeration order'
    - 'NOTE: the ledger row and the log line carry an upstream FINGERPRINT beside the class —
      upstreamKind (the error''s class name), errorKind (AppError''s closed union), failureMode
      (validated against FAILURE_MODES) and sqlState (matched against /^[0-9A-Z]{5}$/ and nothing else).
      googleCallError deliberately drops the upstream message and its cause, because a library that built
      its message from the request would carry an Authorization header into every log line quoting it —
      and the cost of that showed up immediately: a TransientUpstream with nothing attached named nothing,
      and 53300 (too_many_connections) was the value that would have. The SQLSTATE pattern is the
      load-bearing part rather than a length cap: the first 64 characters of a bearer token are still most
      of a token, and a test feeds a token-shaped `code` and asserts nothing comes back'
    - 'NOTE deferred: nothing CALLS withGoogle yet. The review autoresponder (G-REV), the SEO agent
      (G-SEO) and the consistency checker are its three consumers and none exists, so the CONSUMERS
      table is exercised by tests rather than by callers. Nothing renders the failure rows either —
      that is the settings card in G-CONN-07 — and the advisory transaction lock around the
      read-refresh-write is G-CONN-04, as G-CONN-01''s NOTE already records'
