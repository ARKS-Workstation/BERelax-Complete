    - 'Idempotent re-run: running the same day twice leaves the row count unchanged and raises no duplicate-key
      error, asserted before and after'
    - 'The 2-3 day lag is modelled: a test on a frozen clock asserts the job''s requested date range ends
      at today minus 3 and never includes today or yesterday'
    - 'The rare-query gap is a stored fact, not an error: a fixture where summed query-level clicks are
