      reminder_scheduler, campaign_sender, analytics_dispatcher, nightly_rollups, compliance_calendar, google_health)
      are all present'
    - 'Heartbeat is written on failure as well as success: a job body that throws still updates last_run_at
      and last_error and leaves last_success_at unchanged, asserted by integration test'
    - 'Watchdog boundary, frozen clock: an enabled agent with declared interval 24h and last_success_at
      47h59m ago produces zero alerts; at 48h01m it produces exactly one alert, and a second watchdog pass
