    summary: 'The shared substrate every agent in the system writes to: agent_definition, agent_run and
      agent_heartbeat, each agent declaring its expected interval, budget and kill switch. A watchdog job
      alerts when any enabled agent has had no success within 2x its declared interval, whatever the cause.
      Built before any Google agent so no agent can be added without a heartbeat.'
