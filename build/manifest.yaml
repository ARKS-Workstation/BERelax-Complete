  - id: M-TILL-12
    order: 54
    title: Bilingual tax invoice, simplified invoice and receipt PDFs
    summary: EN/AR invoice and receipt rendering on the F10 RTL proof, with the full/simplified choice made
      by rule from the document total and customer presence, deterministic output for diffable fixtures,
      and private storage served only through signed URLs.
    owner: claude
    status: done
    size: M
    depends_on:
    - F10
    - M-TILL-04
    blocked_on_owner:
    - Y11-vat-invoice
    - Y1-trn
    provisional: Simplified-invoice threshold set to AED 10,000 gross as the provisional value, flagged
      provisional:true pending the tax agent
    acceptance:
    - the rendered tax invoice PDF, text-extracted, contains every field in the Y11-vat-invoice superset;
      the test enumerates the list and fails naming any missing field
    - the extracted Arabic run matches a committed golden fixture for shaping and right-to-left order, and
      Latin numerals inside Arabic text are bidi-isolated correctly, using the F10 assertion technique
    - 'full versus simplified is chosen by a rule from document total and customer presence, not an operator
      flag: a table-driven test covers both sides of the threshold and asserts no UI path can override it'
    - rendering an invoice whose issuer TRN is the placeholder fails with TrnNotConfigured and writes no
      file
    - two renders of the same invoice under the frozen clock produce byte-identical PDFs, so the fixture
      is diffable
    - 'the PDF is stored privately and served only via a signed URL: an unsigned fetch returns 403 in the
      integration test, and every download writes an audit_event'
    - 'NOTE: which document forms can be issued TODAY, and why it is not the two this unit is named for.
      legal_entity.trn holds the Y1-trn placeholder ''TRN-PENDING-Y1-TRN'', which fails
      invoice_issuer_trn_is_fifteen_digits, fails invoice_issuer_trn_not_placeholder and fails
      requireIssuerTrn() with TrnNotConfigured. A TAX INVOICE and a SIMPLIFIED INVOICE both state the
      supplier TRN — a simplified tax invoice is still a tax document, and invoice.document_kind''s two
      values share those CHECK constraints — so NEITHER can be issued from the real business profile
      until Y1-trn is answered. Nothing provisional was rendered onto a document to work around it: the
      refusal is the deliverable, asserted against the TRN read out of the seeded row rather than a
      constant typed into the test (packages/fixtures/src/tax-document.itest.ts). A RECEIPT can be
      issued today, because it is not a tax document: it states no TRN, no VAT and no registration
      claim, and it carries the sentence saying so. The layout of the two invoice forms is proved with a
      fifteen-digit fixture TRN that reaches nothing but a fixture.'
    - 'NOTE: a third form beyond the two in the title, and it needed one. RECEIPT is modelled as a form
      of its own with its own field list (DOCUMENT_FORM_FIELDS in packages/core/src/documents/invoice-template.ts)
      rather than as a tax invoice with fields hidden, because the difference is what the document
      claims: no TRN, no VAT breakdown, no net total, plus ''This is a receipt for payment. It is not a
      tax invoice.'' in both languages. It has no table of its own either — a receipt acknowledges a
      payment and the till sale and tender rows are M-TILL-05 to M-TILL-11 — so today it renders from
      the same stored document shape with its tax statement suppressed. RECEIPT_SOURCE records that.'
    - 'NOTE: deferred to M-TILL-13 and M-VAT-11 — private storage and the signed URL. Nothing in the
      repository can sign a URL: MediaStorage (packages/media/src/storage/port.ts) exposes put, head,
      get and list and no signing, there is no DigitalOcean Spaces adapter at all (W-SYS-05''s
      [no-real-media-storage-adapter]), and there is no document route to return 403 from. The unsigned
      fetch and the audit_event on download are therefore unimplemented and untested here rather than
      half-built: writeTaxDocumentPdf() writes bytes to a path a caller chooses, and the caller that
      stores and serves them is the till (M-TILL-13). M-VAT-11 needs the identical 403-and-audit pair
      for evidence attachments, so whichever lands first should own the capability rather than build a
      second one.'
    - 'NOTE: "byte-identical" holds only modulo the timestamp Skia writes, and the exception is measured
      rather than assumed. Chromium stamps /CreationDate and /ModDate into every page.pdf and Playwright
      exposes no way to fix them. Two renders of one document in the same second are byte-identical;
      across a second boundary they differ in exactly TWO bytes, both inside those two fields, and are
      identical once the fields are masked. The itest forces the second to tick so the mask is exercised
      rather than coincidentally satisfied, asserts the differing-byte count, and pairs it with a control
      that a different document differs after masking too. The HTML the template produces IS
      byte-identical, and that is the part this unit''s code owns — the renderer reads no clock at all,
      because every date on a document is a stored column, so there is nothing for a frozen clock to
      freeze.'
    - 'NOTE: the Arabic half of the field assertions is made against the HTML, not the extracted PDF
      text, and the reason is a measurement. Chromium draws Arabic as Presentation Forms-B and the
      extraction reconstructs lines geometrically left to right, so an Arabic phrase comes back as
      shaped glyphs in the reverse of its logical order: the supplier label matches only after NFKC
      normalisation AND reversal, and the two-word title matches neither way because the inter-word
      spacing differs. Any "the PDF contains this Arabic string" assertion is therefore false or
      accidental. What pins the Arabic in the PDF is the committed golden — every Arabic line, byte for
      byte, in visual order, in packages/pdf/fixtures/tax-document-golden.json — with the
      presentation-form count and the geometric right-to-left assertions.'
    - 'NOTE: the Arabic-language requirement is rendered but not yet SOURCED. issuer_legal_name_ar,
      issuer_address_snapshot_ar and invoice_line.description_ar are null on every document issued today
      (the NOTE on M-TILL-04), so the Arabic party name, address and line descriptions on a rendered
      document come from caller-supplied fallbacks (ArabicFallbacks) rather than from the record. Every
      label, title, footnote and settlement sentence IS in the template. B-CAT-06 seeds the source
      columns and the stored value then wins over the fallback, which is asserted.'
    - 'NOTE: added beyond the list — `pnpm documents` (scripts/check-tax-documents.mjs), three rules with
      six known-bad fixtures and two controls in scripts/test-gates.mjs. It caught a real defect on its
      first run: packages/pdf/src/documents/invoice.ts declared font-weight 500 on Arabic body copy while
      fonts.ts embeds only 400 and 600, so CSS resolved it downwards to 400 and the declaration had been
      dead since F10 — the same defect apps/web/app/_fonts/index.ts records on the web side. Changed to
      400, which is what it was already drawing: the committed F10 fixture is unchanged in size and its
      PNG is pixel-identical.'
    - 'NOTE: three fields are printed that a customer will never read, so that the Y11 enumeration is
      honest rather than fudged: series_code, period_key and issuer_emirate. The first two are columns
      the superset lists and a document that states its number without stating the range it came from
      cannot be tied to a gap report by the person holding the paper; the emirate is what the licensing
      authority follows from (docs/04 §1). All three sit in the document furniture at 8pt.'
    - 'NOTE: file paths differ from the list below, which is recorded rather than quietly done. The
      renderer is packages/pdf/src/documents/tax-document.ts and not apps/web/src/services/pdf/invoice.ts:
      ADR 0011 puts the Chromium binary in the WORKER, and importing @berelax/pdf into apps/web would
      pull Playwright into the Next build for a page that does not render PDFs. The db-to-view mapping
      lives in packages/core/src/documents/invoice-template.ts as named, taking the stored shape
      structurally so core stays pure; packages/fixtures is where the two are proved to be the same
      shape, because it is the one package allowed to see both. The fixtures are in
      packages/pdf/fixtures/ beside F10''s rather than artifacts/fixtures/, which is where
      scripts/render-pdf-fixtures.mjs writes and where the byte budgets point.'
