  - id: G-AGT-01
    order: 150
    title: Agent registry, heartbeat contract and 2x-interval watchdog
    summary: 'The shared substrate every agent in the system writes to: agent_definition, agent_run and
      agent_heartbeat, each agent declaring its expected interval, budget and kill switch. A watchdog job
      alerts when any enabled agent has had no success within 2x its declared interval, whatever the cause.
      Built before any Google agent so no agent can be added without a heartbeat.'
    owner: claude
    status: done
    size: M
    depends_on:
    - F09
    - H02
    acceptance:
    - 'Registry completeness gate: a test enumerates every pg-boss cron registration at boot and fails naming
      the job if it has no agent_definition row; the eight declared agents (seo_agent, review_autoresponder,
      reminder_scheduler, campaign_sender, analytics_dispatcher, nightly_rollups, compliance_calendar, google_health)
      are all present'
    - 'Heartbeat is written on failure as well as success: a job body that throws still updates last_run_at
      and last_error and leaves last_success_at unchanged, asserted by integration test'
    - 'Watchdog boundary, frozen clock: an enabled agent with declared interval 24h and last_success_at
      47h59m ago produces zero alerts; at 48h01m it produces exactly one alert, and a second watchdog pass
      in the same incident produces no further alert'
    - A disabled agent produces no alert, and re-enabling it does not emit a backdated alert for the disabled
      window (test asserts alert count is 0 across both transitions)
    - 'Kill switch: flipping it prevents the next scheduled run from executing its body, proven by an execution
      counter that stays at its prior value, and the run is recorded with outcome ''stopped_by_kill_switch''
      rather than an error'
    - 'Per-run budget cap: a run whose recorded LLM cost exceeds the configured cap aborts mid-run, persists
      the partial cost as integer fils, and does not set last_success_at'
    - 'Known-bad fixture per ADR 0003: scripts/test-gates.mjs registers a cron job with no agent_definition
      row and asserts the registry gate fails by name, then removes the fixture in a finally block'
    - 'NOTE: the registry-completeness criterion is met in two halves, because one check cannot cover both
      sides. The static half is the cron-without-an-agent rule in scripts/check-job-registry.mjs (pnpm
      jobs), with a known-bad fixture in scripts/test-gates.mjs that removes the agent declaration from the
      real registry and restores it in a finally — asserted by rule name. The runtime half, that the named
      agent actually has an agent_definition row, needs a database and lives in
      apps/worker/src/jobs/agent-watchdog.itest.ts, paired with a control in the same shape that must fail.
      JobDefinition.agent is required whenever cron is set, enforced by assertRegistry at import time.'
    - 'NOTE: ten agent_definition rows are seeded, not eight. The ninth is audit_partitions — migration
      0005 creates audit_event with no DEFAULT partition on purpose, so that job stopping means audit
      inserts FAIL rather than landing somewhere nobody prunes, and it had been declared since F04 and
      watched by nothing. The tenth is agent_watchdog itself: a watchdog exempt from its own contract is a
      watchdog whose failure is invisible, which is the exact shape of failure this table set removes. What
      reads its stale heartbeat is the alerting ladder in H-HARD-05.'
    - 'NOTE: "re-enabling does not emit a backdated alert" is structural rather than a special case.
      agent_definition.enabled_since is moved by setEnabled only on a disabled-to-enabled transition, and
      the watchdog measures silence from greatest(last_success_at, enabled_since). An idempotent settings
      save therefore does not reset the clock — which would otherwise have reported the whole system
      healthy for two intervals after any admin page was saved.'
    - 'NOTE: alert deduplication is a unique (agent_key, incident_key) with on conflict do nothing, where
      the incident key is derived from the instant silence began. Two watchdog passes can overlap, and the
      loser of a check-then-insert race would throw inside a cron nobody watches — the same class of silent
      failure this unit removes.'
    - 'NOTE: withAgentRun is deliberately NOT one transaction around the body. The run row and the
      heartbeat must survive a body that throws, and a single transaction would roll back the evidence
      along with the work — precisely the case the heartbeat contract exists to make visible.'
    - 'NOTE: the integration test for the run paths lives in packages/fixtures/src/agents.itest.ts, not
      beside the repository, because it needs withAgentRun from @berelax/db AND createRunBudget from
      @berelax/core. db may not import core and the pairing is what is under test — withAgentRun classifies
      an abort as budget_exceeded by recognising the error the real budget throws, so a test supplying its
      own budget would prove nothing about the pair. docs/CONTRIBUTING-AGENT-BRIEF.md rule 4 names fixtures
      as the home for exactly this.'
    - 'NOTE: deferred — nothing notifies. An alert is a row in agent_alert with a deduplicated incident
      key; the escalation ladder, the email and the console are H-HARD-05 and the per-module admin units.
      The eight named agents also have no job bodies yet: their agent_definition rows exist so the
      completeness rule has something to satisfy, and each later unit registers its own cron against the
      row already there.'
    - 'NOTE: the migration is 0021_agent_registry.sql, not the 0040 the files list guessed at.'
    files:
    - packages/db/migrations/0021_agent_registry.sql
    - packages/db/src/schema/agents.ts
    - packages/core/src/agents/watchdog.ts
    - apps/worker/src/jobs/agent-watchdog.ts
    - apps/worker/src/registry.ts
    - apps/worker/src/jobs/agent-watchdog.itest.ts
    - packages/db/src/repositories/agents.ts
    - packages/fixtures/src/agents.itest.ts
    - packages/core/src/agents/watchdog.test.ts
    - scripts/check-job-registry.mjs
  - id: G-CONN-01
    order: 151
    title: 'google_connections schema: one-to-many, sub-keyed, envelope-encrypted'
    summary: The three tables from docs/10 SS2 with google_sub as the identity key, no singleton constraint
      and no uniqueness on email, so a GBP-owning account and a Search-Console-verified account can coexist
      as two rows. Refresh and access tokens are envelope-encrypted with a kid so rotation is a re-wrap
      job, reusing F08's DEK/KEK primitive.
    owner: claude
    status: done
    size: M
    depends_on:
    - F04
    - F08
    - F09
    blocked_on_owner:
    - Y2-listing-owner
    - Y2-gbp-status
    provisional: Fake OAuth identity fixture representing the owner's personal Gmail as GBP owner; a second
      fixture sub for a differently-verified Search Console property, so the one-to-many path is exercised
      without the real answer
    acceptance:
    - 'Schema test: UNIQUE(google_sub) exists; no unique index, primary key or single-row CHECK touches
      google_email; inserting two active rows with the same google_email and different google_sub succeeds,
      and a second active connection does not violate any constraint'
    - 'Ciphertext-at-rest test: after storing a fixture refresh token, a raw SELECT of refresh_token_ct
      returns bytes that do not contain the fixture token as a substring in UTF-8, latin1 or base64 encoding'
    - refresh_token_kid is NOT NULL; a re-wrap job moves every row from kid v1 to v2 without touching status
      or capabilities, and the token decrypts to the identical plaintext afterwards (round-trip assertion
      on 3 seeded rows)
    - 'google_connection_events is append-only: UPDATE and DELETE against it are rejected by a rule or trigger
      (test asserts both raise), and every insert writes a mirrored audit_event row in the same transaction'
    - status is constrained to exactly active|needs_reauth|revoked|disconnected and granted_scopes is text[]
      NOT NULL; an insert with status 'expired' is rejected, and an insert with granted_scopes NULL is rejected
    - google_capabilities.capability is constrained to gbp_reviews|gbp_location|gbp_performance|gsc, resource_ref
      is jsonb, and at most one row per (connection_id, capability) may have primary=true (partial unique
      index, proven by a rejected second insert)
    - 'NOTE: the migration is numbered 0016_google_connection.sql, not 0041 — 0012 and 0013 are reserved
      by units in flight and 0014/0015 are used, so the next free number is 0016. The schema assertions
      live in packages/db/src/schema/google.itest.ts rather than a .test.ts, because every one of them
      is a claim about a real PostgreSQL and a unit test could only assert against a mock of it'
    - 'NOTE: the column is is_primary, not primary — `primary` is a reserved word in SQL. The partial
      unique index google_capability_one_primary is on (connection_id, capability) WHERE is_primary, and
      there is deliberately no plain unique on (connection_id, capability): one account may be verified
      on several Search Console properties and manage several locations, and a unique pair would make the
      primary flag meaningless and the rejected-second-insert test vacuous'
    - 'NOTE: google_connection_events.connection_id is a plain uuid with no foreign key, as on audit_event.
      An append-only log whose rows a DELETE can rewrite is not a log, and an ON DELETE SET NULL fires an
      UPDATE that the append-only trigger correctly refuses — which made a connection with events
      undeletable. Caught by the integration test, not by review'
    - 'NOTE deferred to G-CONN-04: the advisory transaction lock and double-checked re-read from docs/10
      §4. accessTokenFor refreshes proactively inside the 5-minute margin, but the serialisation belongs
      around the whole read-refresh-write in a transaction, one level up. Taking the lock here would look
      serialised without being it'
    - 'NOTE deferred to G-CONN-06/07/08: deriveConnectionHealth in packages/core/src/google/connection.ts
      computes the displayed state, the staleness window and the consent_at + 7 day Testing tripwire, and
      returns the deduped notification decision. Nothing renders it and nothing sends an email yet — there
      is no admin app shell until W-SYS-01, the daily check is G-CONN-06, the settings card G-CONN-07 and
      the banner and notification ladder G-CONN-08'
    files:
