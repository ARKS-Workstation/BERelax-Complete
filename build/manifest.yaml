  - id: G-SEO-02
    order: 169
    title: 'The seo_agent principal: publish denied at the permission layer, target allowlist'
    summary: Build the cage before the animal. The agent runs under a dedicated principal whose permission
      set contains no write capability at all, so publish is refused by the policy layer rather than by
      a prompt or a UI guard. Suggestion targets are restricted to an allowlist that excludes robots.txt,
      canonicals, redirects and noindex, enforced by a check constraint as well as code.
    owner: claude
    status: todo
    size: M
    depends_on:
    - F07
    - G-SEO-01
    acceptance:
    - 'Permission enumeration: a test lists the full resolved permission set of the system:seo_agent principal
      and asserts publish, revalidate, sitemap_write, redirect_write, robots_write, noindex_write, canonical_write
      and cms_write are all absent, relying on F07 deny-by-default'
    - 'Direct-call refusal at the policy layer: invoking the publication function with the seo_agent credential
      is refused by the policy layer with no UI involved, and the test asserts the refusal originates from
      the policy module (by error type and call site), not from a route guard'
    - 'The refusal is a live gate, not a comment: scripts/test-gates.mjs grants publish to the seo_agent
      principal in a fixture, asserts the policy test FAILS, and reverts in a finally block (ADR 0003)'
    - 'Target allowlist is enforced in the database: an INSERT of a suggestion whose target is robots.txt,
      a canonical tag, a redirect rule or a noindex directive is rejected by a CHECK constraint, proven
      for all four'
    - 'Untrusted-data envelope primitive: fetched HTML and SERP text pass through one wrapper that escapes
      the delimiter, fuzz-tested over 200 adversarial strings, and a dependency-cruiser rule forbids any
      SEO module from constructing a prompt without it, with a known-bad fixture'
    - 'The keyword blocking filter from the regulatory profile is applied at the ingest boundary: a banned
      medical term present in the GSC fixture never appears in any persisted candidate row, and the drop
      is logged with the term redacted'
