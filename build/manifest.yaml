  - id: G-CONN-04
    order: 154
    title: Proactive token refresh under an advisory transaction lock, double-checked
    summary: Refresh when expiry is under five minutes away, never reactively on 401. Serialise with pg_advisory_xact_lock(hashtextextended('google:'||id,
      0)) and re-read the row inside the lock so the loser of the race uses the winner's token. Persist
      a rotated refresh token if Google ever returns one.
    owner: claude
    status: todo
    size: M
    depends_on:
    - G-CONN-03
    acceptance:
    - 'Concurrency integration test against real Postgres: ten simultaneous withGoogle calls on one connection
      whose access token expires in 60s produce exactly one token-refresh call against the fake (counter
      assertion) and ten successful calls'
    - 'The lock is transaction-scoped: after the refreshing transaction commits, a query of pg_locks returns
      zero advisory locks for the computed key, proving no lease or manual release is involved'
    - 'Expiry boundary: a token expiring in 4m59s triggers a refresh and a token expiring in 5m01s does
      not, asserted on a frozen clock in both directions'
    - 'No reactive refresh on 401: the fake returns 401 while the stored token is unexpired; the call surfaces
      the classified error and the refresh counter stays at 0'
    - 'Rotated refresh token is persisted: when the fake returns a new refresh token, the stored ciphertext
      changes, the new value round-trips, and the old plaintext no longer matches any stored row'
    - 'Token never reaches a job payload: after a full refresh cycle driven by a pg-boss job, a scan of
      pgboss.job.data across all rows finds zero occurrences of the fixture refresh token in any encoding'
    files:
    - packages/google/src/token-refresh.ts
    - packages/google/src/token-refresh.integration.test.ts
