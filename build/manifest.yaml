  - id: M-TILL-02
    order: 44
    title: Append-only journal schema, period locks and the posting repository
    summary: Drizzle schema and migration for account, journal_entry, journal_line and period_lock, with
      append-only enforced at the grant and trigger level, the balance invariant as a deferred constraint
      trigger, and a posting repository that is the only write path. Integration-tested against real Postgres
      because grants and deferred triggers cannot be tested against a mock.
    owner: claude
    status: done
    size: M
    depends_on:
    - F04
    - F06
    - M-TILL-01
    acceptance:
    - 'integration test against postgres:16: UPDATE journal_line and DELETE journal_line each raise for
      the application role, and the assertion matches on SQLSTATE or the named trigger error, not on any
      error'
    - a test queries information_schema.role_table_grants and fails if the application role holds UPDATE
      or DELETE on journal_line or journal_entry
    - a deferred constraint trigger rejects COMMIT of an entry whose lines do not sum to zero; the test
      inserts the lines one by one (each succeeding) and asserts the failure occurs at COMMIT, proving an
      immediate trigger would have been wrong
    - inserting a journal_line whose entry_date falls inside a locked period raises PeriodLocked with the
      locked period identifier in the message
    - every posting through the repository writes an audit_event with before/after via F06; a test counts
      audit rows per posting and fails on zero
    - the migration is forward-only and pnpm db:migrate:dry passes; the seeded chart of accounts round-trips
      to the packages/core chart with no drift, asserted by a comparison test
    - 'NOTE: the application role is refused UPDATE and DELETE on journal_entry and journal_line by the GRANT,
      so for that role the statement raises 42501 (insufficient_privilege) and never reaches the trigger. The
      named trigger error ZL001 is therefore asserted in the same suite for the OWNER role, which is what a
      migration or a psql session connects as and the one role a privilege cannot constrain. Both layers are
      asserted, both on SQLSTATE, and the ZL001 cases additionally on the trigger''s own message; nothing in
      the suite matches on "an error was raised". TRUNCATE is covered separately, because it is the one
      statement that does not fire a row-level DELETE trigger: 0018 revokes it from berelax_app, the itest
      asserts the refusal, and the itest itself uses TRUNCATE as the owner to reset between cases.'
    - 'NOTE: what before/after means for an append-only insert. A fresh posting records no before state,
      because there was none — a fabricated one would be a record of something that never existed, and
      postgres.js serialises sql.json(null) as SQL NULL anyway, so an explicit null is indistinguishable from
      an omission in the stored row. A REVERSAL does have a prior state, so it records the entry it corrects,
      read back inside the same transaction rather than taken from the caller. Both shapes are asserted and
      each is the other''s control; the count-per-posting criterion is proved as a delta from a timestamp
      captured in beforeEach, because audit_event is append-only and a total would differ on every re-run.'
    - 'NOTE: the chart round-trip lives in packages/fixtures/src/ledger-chart.itest.ts rather than in
      packages/db, because it compares core''s STANDARD_SPA_CHART against the seeded rows and db must never
      import core (db-must-not-import-core); fixtures is the package allowed to depend on both. The
      migration''s 62 account rows were GENERATED from that chart, not retyped. The comparison runs in both
      directions over every field in ACCOUNT_FIELDS, feeds each stored row back through core''s defineAccount,
      and is itself shown to fail five ways — a renamed account, a re-tagged vat_box, a missing account, an
      extra account and a dropped provisional marker — one of them as a rolled-back UPDATE against the
      database rather than against a copy of the rows.'
    - 'NOTE: deferred to M-VAT-06 — lockAccountingPeriod checks no preconditions. Refusing a close until the
      trial balance balances and every document in the period is posted, naming the earliest OPEN period in
      the refusal, and hashing the period''s trial balance into the audit row are that unit''s acceptance
      lines. What is here is the mechanism they need: period_lock with a gist exclusion constraint that makes
      two overlapping locks impossible (so the named period is never ambiguous), period_lock_for(date) as the
      single definition of "is this date closed", BEFORE INSERT guards on journal_entry and journal_line, and
      no exported way to reopen a period. M-TILL-01''s NOTE that period locking belongs here rather than as a
      pure predicate in core is discharged by this.'
    - 'NOTE: the gate this unit adds is a third rule in scripts/check-schema-conventions.mjs,
      append-only-table-must-refuse-update-and-delete. A table whose own SQL comment claims "UPDATE and
      DELETE raise" must have BOTH a BEFORE UPDATE and a BEFORE DELETE trigger somewhere in the migrations,
      and must carry neither an updated_at column nor a set_updated_at trigger. Scoped by that declaration
      rather than by a hardcoded list, so it already judges google_connection_events from 0016 as well as the
      two journal tables; audit_event and app_setting_history are out of scope on purpose, because
      `create rule ... do instead nothing` makes a weaker promise and reports success to the caller. Case 28
      in scripts/test-gates.mjs proves it fires four ways by rule name, including the copy-paste defect where
      the DELETE trigger exists and the UPDATE one does not, plus the control that the correct shape passes.'
    - 'NOTE: no caller posts through this repository yet; M-TILL-06 is the first. Because db may not import
      core, JournalEntryInput is a structural mirror of core''s JournalEntry — Money becomes integer
      debitFils/creditFils, LocalDate becomes an ISO YYYY-MM-DD string, EntryId becomes a string — and the
      caller maps field for field. The balance failure arrives from COMMIT, which belongs to withUnitOfWork
      rather than to any repository function, so the SQLSTATE translation is exported as journalError() for
      that caller to wrap its own transaction with, rather than hidden in a catch block that could never see
      it. No TypeScript balance pre-check is added: core''s postEntry and the deferred trigger are already
      two statements of that rule, and a third would be a second opportunity to disagree.'
    files:
    - packages/db/src/schema/ledger.ts
    - packages/db/src/schema/index.ts
    - packages/db/src/index.ts
    - packages/db/migrations/0018_ledger.sql
