  - id: B-AVAIL-06
    order: 26
    title: 'The booking transaction: room row lock, idempotency, all-or-none, price snapshot'
    summary: The write path. One transaction takes SELECT ... FOR UPDATE on every room row it will write
      in a deterministic order, re-validates the slot, inserts all appointments for the booking or none,
      snapshots the resolved price and tax onto each appointment, and writes the outbox event and audit
      event in the same transaction. The public endpoint requires an idempotency key.
    owner: claude
    status: todo
    size: L
    depends_on:
    - B-AVAIL-01
    - B-AVAIL-03
    - B-AVAIL-05
    - B-CAT-04
    - F06
    acceptance:
    - The transaction takes SELECT ... FOR UPDATE on every room row it writes, ordered by room id; a test
      inspects pg_locks to confirm the lock is held, and a stress test of two interleaved couples bookings
      on overlapping room sets completes 200 iterations with zero deadlocks
    - 'Two concurrent requests for the last remaining slot: exactly one commits and the other receives a
      named `slot_taken` error, repeated 100 times in an integration test with zero double-bookings and
      zero over-capacity rooms'
    - booking_idempotency has a UNIQUE constraint on the client-supplied key; replaying the same key returns
      the original booking id and creates no second booking, including when the first request is still in
      flight (asserted with a deliberately delayed first transaction)
    - A POST to the public booking endpoint with no idempotency key is rejected with 400 and a named error,
      asserted at the route handler
    - A multi-appointment booking whose second appointment violates a constraint leaves zero booking and
      zero appointment rows, asserted by row counts before and after
    - Each appointment stores gross_price_fils, net_fils, vat_fils and the price_list_id / promotion_id
      that produced them; a subsequent price_list change leaves all five values unchanged
    - 'The appointment insert, the outbox booking.created event and the audit_event commit together: killing
      the worker before it drains leaves the event in pending state and zero messages sent, and draining
      later delivers it exactly once'
    files:
    - packages/db/src/repositories/create-booking.ts
    - apps/web/app/api/v1/bookings/route.ts
    - packages/db/src/repositories/create-booking.concurrency.test.ts
    - packages/db/src/repositories/create-booking.test.ts
  - id: B-CAT-05
    order: 27
    title: Catalogue mutation guard rails and the public display-name compliance lint
    summary: 'The guard rails that stop a non-technical owner breaking the engine from the admin UI: archive-never-delete
      when appointments exist, duration and price invariants, automatic 301 on slug change, and the banned-claims
      lexicon lint applied to the public display name while the internal name stays unconstrained. Owns
      the redirect table and the compliance-lexicon module that W-SITE later reuses.'
    owner: claude
    status: done
    size: M
    depends_on:
    - B-AVAIL-01
    - B-CAT-04
    acceptance:
    - Archiving a service that has a future appointment succeeds and removes it from bookable availability;
      DELETE on that service is refused by ON DELETE RESTRICT and surfaces a named `service_has_appointments`
      domain error, both asserted against real Postgres
    - Changing a service slug inserts a redirect row (old_path, new_path, 301) in the same transaction;
      a route test then asserts the old path returns 301 with the new Location
    - The lexicon lint rejects 'Therapeutic Deep Tissue Treatment' as a public display name with the offending
      term named, and accepts the identical string as the internal name; the banned term list and permitted
      staff titles are read from regulatory_profile, asserted by flipping the profile in a test
    - Publishing a service without a compat row, without a resource shape, or without at least one priced
      variant produces three distinct named errors, each asserted separately
    - Every catalogue mutation writes an audit_event with before/after through F06 — asserted for price,
      public display name, slug and archive, four cases
    - A price_list change leaves every existing appointment's snapshotted gross_price_fils, net and vat
      untouched, asserted over a seeded appointment before and after
    - 'NOTE: the migration is packages/db/migrations/0029_redirect.sql and SCHEMA_VERSION is 29.
      0026 (M-TILL-04) and 0028 (M-VAT-01) were merging in parallel, so this unit took 0029 rather
      than the next free number in its own worktree. The suite named catalogue.test.ts in the file
      list is two files: catalogue.test.ts for the halves that need no database (the SQLSTATE and
      constraint-name translation, and the fail-closed lint check) and catalogue.itest.ts for the
      guard rails themselves - packages/db has no database in the unit runner, so a database-backed
      suite there must be an .itest.ts or it never connects. Same correction as otp.itest.ts
      (B-LIFE-02) and booking-constraints.itest.ts (B-AVAIL-01).'
    - 'NOTE: the redirect table is `redirect_map (source_path, target_path, status_code, reason,
      created_by, ...)`, not a table named `redirect` with columns old_path/new_path. The acceptance
      triple (old_path, new_path, 301) is satisfied as (source_path, target_path, status_code = 301);
      the names are W-SITE-09''s, whose acceptance imports the legacy WooCommerce URLs into "the same
      table" and shares the one-hop invariant. Two redirect tables would be two answers to "where does
      this path go", settled by whichever middleware ran first.'
    - 'NOTE: the route half is apps/web/app/(en)/(public)/treatments/[slug]/route.ts plus its
      handler.ts, and it is a placeholder W-SITE-05 supersedes - a rendered page.tsx cannot coexist
      with a route.ts in one segment, so that unit deletes the route and moves the resolution into the
      page. It returns text/plain for a live service, deliberately not markup, so it cannot be mistaken
      for the treatment page. An archived service''s own path 404s today rather than 301-ing to
      /treatments, because that index page does not exist yet (W-SITE-05): a 301 to a page that is not
      there is the 404-with-extra-steps this unit exists to prevent. The one target this schema cannot
      check is the same /treatments index that archiving retargets redirects onto - it resolves when
      W-SITE-05 ships it, and the trigger deliberately checks only /treatments/<slug> targets, since
      nothing in this schema knows what resolves outside the catalogue.'
    - 'NOTE: the lint is applied at the db chokepoint through an INJECTED function, because packages/db
      must never import packages/core. setPublicDisplayName refuses to write a public name when no lint
      was supplied (public_display_name_unlinted) rather than defaulting to permitting it, and
      readCompliancePolicy reads regulatory_profile_current for the caller to feed to core. The pair is
