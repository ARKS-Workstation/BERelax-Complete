    summary: Every scheduled message is a row carrying an invalidation key derived from the appointment's
      current period, never a fire-and-forget delayed job. CONFIRMED creates the reminder set, RESCHEDULED
      supersedes it and creates a new one, CANCELLED_* cancels it. The worker refuses any step whose key
      no longer matches. This is the most damaging bug in the domain, so it is tested as an invariant.
