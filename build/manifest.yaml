  - id: G-CONN-04
    order: 154
    title: Proactive token refresh under an advisory transaction lock, double-checked
    summary: Refresh when expiry is under five minutes away, never reactively on 401. Serialise with pg_advisory_xact_lock(hashtextextended('google:'||id,
      0)) and re-read the row inside the lock so the loser of the race uses the winner's token. Persist
      a rotated refresh token if Google ever returns one.
    owner: claude
    status: done
    size: M
    depends_on:
    - G-CONN-03
    acceptance:
    - 'Concurrency integration test against real Postgres: ten simultaneous withGoogle calls on one connection
      whose access token expires in 60s produce exactly one token-refresh call against the fake (counter
      assertion) and ten successful calls'
    - 'The lock is transaction-scoped: after the refreshing transaction commits, a query of pg_locks returns
      zero advisory locks for the computed key, proving no lease or manual release is involved'
    - 'Expiry boundary: a token expiring in 4m59s triggers a refresh and a token expiring in 5m01s does
      not, asserted on a frozen clock in both directions'
    - 'No reactive refresh on 401: the fake returns 401 while the stored token is unexpired; the call surfaces
      the classified error and the refresh counter stays at 0'
    - 'Rotated refresh token is persisted: when the fake returns a new refresh token, the stored ciphertext
      changes, the new value round-trips, and the old plaintext no longer matches any stored row'
    - 'Token never reaches a job payload: after a full refresh cycle driven by a pg-boss job, a scan of
      pgboss.job.data across all rows finds zero occurrences of the fixture refresh token in any encoding'
    - 'NOTE: the integration test is token-refresh.itest.ts, not token-refresh.integration.test.ts. The
      suite''s convention is *.itest.ts for integration and *.test.ts for unit, and
      vitest.integration.config.ts includes packages/**/*.itest.ts — a file named
      .integration.test.ts would have been collected by the UNIT runner, which has no database, and
      would have failed on the first line rather than running'
    - 'NOTE: the token allow-list was NOT widened, and that shaped the module boundary. token-refresh.ts
      holds the lock and the double check only; the plaintext token stays in lifecycle.ts, which is
      already one of the five modules permitted to hold one. accessTokenUnderLock calls
      loadActiveConnection, cachedAccessGrant and refreshAccessToken and never names openToken,
      sealToken, rewrapToken or connectionBinding, and never imports token-store.ts — so
      google-tokens-only-in-with-google and scripts/check-google-token-chokepoint.mjs are both unchanged
      and still report five modules. Moving the refresh into this file, as G-CONN-03''s NOTE anticipated,
      would have meant a SIXTH entry on both allow-lists in exchange for a file move; a new case in
      scripts/test-gates.mjs pins the list so a later widening has to be a decision rather than a diff.
      cachedAccessGrant was extracted from accessTokenFor rather than copied, because the margin
      arithmetic is asked twice — once before the lock and once inside it — and two copies of it would
      eventually disagree in the direction of a token that expires mid-request'
    - 'NOTE: WithGoogleDeps.lock is REQUIRED, not optional. An optional lock is one every consumer may
      omit, which is the failure lifecycle.ts refused to introduce by taking the lock one level too low:
      a refresh path that can be bypassed looks serialised without being it. withGoogle now calls
      accessTokenUnderLock; accessTokenFor remains as the unlocked primitive the locked path is built
      from and the only path available to a store with no transaction seam. createMemoryRefreshLock
      serialises per connection id for the unit tests rather than passing bodies straight through — a
      permissive fake here would make every double-check assertion above it pass for the wrong reason'
    - 'NOTE: the double check is only correct under READ COMMITTED, so it is asserted rather than
      assumed. Under REPEATABLE READ the snapshot is taken at the first statement — the lock
      acquisition itself — so the re-read returns the row as it was BEFORE the winner committed and the
      loser refreshes anyway, silently and while looking correct. assertReadCommitted runs inside the
      transaction on current_setting(''transaction_isolation''); its rejecting branch is unit-tested for
      all three other levels, because the failure branch of a guard nothing has watched fail is not a
      guard'
    - 'NOTE: a lock_timeout was added and is not decoration. pg_advisory_xact_lock waits for ever by
      default, so a hung HTTPS call to Google would leave every waiter holding an open transaction and
      therefore a pooled connection — one slow refresh becoming 53300 too_many_connections for the
      booking flow. SET LOCAL via set_config(…, true) so it cannot leak onto the next user of a pooled
      connection; 55P03 is translated into an AppError whose details.reason is
      google_refresh_lock_timeout, which classifies TransientUpstream and therefore throws for pg-boss
      to retry with backoff rather than degrading the consumer. Proven against a lock held on a reserved
      connection, with the contention itself asserted from a third session first'
    - 'NOTE: FakeGoogleOptions gained rotatesRefreshToken (default false, Google''s ordinary behaviour).
      Until it existed the rotation branch in refreshAccessToken was unreachable from any test, and the
      acceptance line about a rotated token could only have been satisfied by a hand-built response. Its
      control is the default: with rotation off the stored ciphertext must be byte-identical afterwards,
      which is what stops "the ciphertext changed" from being a statement about recordRefresh rewriting
      the column unconditionally. The change is additive and every existing caller still compiles'
    - 'NOTE: the ten-way race is made deterministic by a barrier, and that was a real flake rather than a
      precaution. accessTokenUnderLock reads the row once before it takes the lock, so whether a caller
      reaches the lock at all depends on whether its read landed before the winner''s COMMIT — scheduling,
      not behaviour. Asserting that all ten reached it passed when the file ran alone and FAILED inside the
      full sequential suite, where the extra load let later reads see the committed row and take the fast
      path. storeHoldingEveryReader wraps the outer store''s load so every caller holds the stale row
      before any of them locks, which is both deterministic and the exact scenario docs/10 §4 describes:
      three jobs starting in the same second on different workers, all seeing a stale token. The barrier
      releases in JS after each query returned, so no connection is held while waiting, and the store
      inside the lock is a different object so the double check is never held. The test also now asserts,
      from withGoogle''s own log lines, that exactly one of the ten reported refreshed=true and the other
      nine reported false — one did the work and nine used its token, which is the sentence the unit
      exists to make true'
    - 'NOTE: the concurrency control asserts MORE than one refresh rather than exactly ten. Re-run with
      a pass-through lock the count lands between six and ten depending on which read happens after
      which commit — the non-determinism IS the complaint, and pinning it would make the control flaky
      while proving nothing beyond "not one". The acceptance line''s own assertion is exact: one refresh
      request against the fake, ten ok outcomes, and one refreshed row in the append-only log'
    - 'NOTE: "the old plaintext no longer matches any stored row" is asserted on the BYTES of every row,
      not by decrypting each one, and the first version of it was a false failure of exactly the kind
      the brief warns about. Every integration file makes its own KEK with generateKek(''v1''), which is
      randomBytes, so a loop that opened every row raised an authentication failure the moment another
      suite had left one behind — it passed alone and failed in the full sequential suite. A byte scan
      needs no key, so it covers their rows too, and it is the stronger claim: it would also catch a
      token written to the column by something that never encrypted it. Its own control writes the
      plaintext into refresh_token_ct, asserts the scan finds it, and deletes the row immediately, because
      zero hits is also what a query against the wrong column reports. This file isolates itself the way
      with-google.itest.ts does — status = ''disconnected'' for every other google_sub rather than a
      DELETE, because google_reviews.connection_id is ON DELETE RESTRICT'
    - 'NOTE: no migration and no SCHEMA_VERSION change, and no new cron. The pg-boss job in the payload
      test is a queue owned by the test file, because the scheduled refresh is G-CONN-06''s daily health
      check at 03:00 Asia/Dubai — declaring a cron here would need an agent_definition row for a job
      that unit owns. The google_connections_access_token_complete CHECK from 0016 is what the new write
      is proven against: three known-bad partial writes in scripts/test-gates.mjs are rejected by the
      constraint name, with both legitimate shapes (all six written, all six cleared) as controls'
    files:
    - packages/google/src/token-refresh.ts
    - packages/google/src/token-refresh.test.ts
    - packages/google/src/token-refresh.itest.ts
    - packages/google/src/lifecycle.ts
    - packages/google/src/with-google.ts
    - packages/google/src/index.ts
    - packages/google/src/with-google.test.ts
    - packages/google/src/with-google.itest.ts
    - packages/providers/src/google/fake-google.ts
