  - id: B-CAT-01
    order: 17
    title: Premises hours, closures and the first-class business_day
    summary: Model trading hours that cross midnight. Adds premises_hours, premises_closures and the business_day
      table (one row per trading date carrying opens_at/closes_at as timestamptz instants), plus a pure
      packages/core resolver that maps an arbitrary instant to its trading date and enumerates the trading
      windows for a date net of closures. A horizon generator materialises business_day rows idempotently.
    owner: claude
    status: todo
    size: M
    depends_on:
    - F04
    - F05
    - F09
    - H03
    blocked_on_owner:
    - Y8-hours
    provisional: Daily 11:00-02:00 Asia/Dubai, no Ramadan variation configured. Y8-hours is resolved for
      the base hours but the Ramadan variation is still unanswered; the schema carries a date-ranged hours
      override so a Ramadan row is data, not a migration.
    acceptance:
    - 'Table-driven test: 2026-10-03T01:30+04:00 resolves to trading date 2026-10-02; 2026-10-03T11:00+04:00
      resolves to 2026-10-03; 2026-10-03T10:59+04:00 resolves to no business day and returns a named `outside_trading`
      reason rather than null-by-accident'
    - business_day rows store opens_at and closes_at as timestamptz with a CHECK closes_at > opens_at; the
      seeded 11:00-02:00 row spans exactly 15 hours (54000 s), asserted arithmetically
    - 'Property-based test over 10,000 random instants across a 400-day horizon: every instant maps to at
      most one business_day, and the mapping agrees with an independent naive interval scan'
    - A premises_closure overlapping a trading window makes tradingWindowsFor(date) return the surviving
      sub-windows; a full-day closure returns zero windows and a mid-day closure returns exactly two
    - 'The generator is idempotent: running it twice over the same 400-day horizon changes no rows, asserted
      by comparing a hash of the full table before and after'
    - The suite passes identically under TZ=UTC and TZ=Pacific/Kiritimati, proving no fixed-offset assumption
      anywhere in the resolver
    - 'packages/core/src/business-day contains no clock access: Date.now and new Date() are absent and the
      F05 lint rule fails a fixture that adds one'
