      AED totals) and fails on any missing NOT NULL column
    - the invoice repository exports no update, edit, void or delete function (export-surface test) and
      the application role holds no UPDATE grant on invoice or invoice_line
    - 'tax_point_date is stored separately from issue date: a test asserts a supply on business_day D invoiced
      on D+1 keeps tax_point_date = D'
    - 'NOTE: deferred to M-TILL-12 and B-CAT-06 — the Arabic-language requirement is carried but cannot be NOT
      NULL. issuer_legal_name_ar, issuer_address_snapshot_ar and invoice_line.description_ar are nullable
      because there is nothing to snapshot FROM: legal_entity has no Arabic legal name, premises no Arabic
