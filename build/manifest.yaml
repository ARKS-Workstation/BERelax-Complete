    depends_on:
    - B-LIFE-03
    - B-MSG-02
    acceptance:
    - A reminder is a scheduled_step row whose invalidation_key is a deterministic function of (appointment_id,
      step_type, period); a test asserts no pg-boss job payload contains message body, phone number or template
      id — the queue only carries a step id
    - CONFIRMED creates the declared reminder set; RESCHEDULED sets the old rows to superseded and inserts
      new ones; CANCELLED_BY_CUSTOMER and CANCELLED_BY_SALON set them to cancelled — asserted by row state
      counts for all four transitions
