  - id: M-VAT-04
    order: 59
    title: Recurring cost register with fixed/variable split and variance alerting
    summary: recurring_cost definitions generating deterministic expected instances under the frozen clock,
      matched idempotently against arriving bills, with over-tolerance variance alerts and missing-cost
      alerts, and a 12-period forward schedule for the cash-flow forecast R-REP will consume.
    owner: claude
    status: done
    size: M
    depends_on:
    - H03
    - M-VAT-01
    acceptance:
    - 'a monthly recurring cost generates exactly one expected instance per period over 24 simulated months
      under the frozen clock: 24 instances, no duplicates, no gaps'
    - a variable cost saved without an expected range fails validation with ExpectedRangeRequired; a fixed
      cost without an expected amount likewise
    - a bill matched above the configured tolerance raises a variance alert carrying the delta in fils;
      a within-tolerance bill raises none, asserted at the tolerance boundary on both sides
    - an expected instance with no matching bill by its due date raises a missing-cost alert exactly once
      across repeated job runs, not once per run
    - 'matching is idempotent on (recurring_cost_id, period): a unique constraint makes the second match
      raise'
    - the 12-period forward schedule totals a committed worked example to the fils and is queryable by R-REP
      without touching the cost tables directly
    - 'NOTE: THE VARIANCE DEFINITION. A variance is the difference between what a bill charged and what the
      register declared it expected FOR THAT PERIOD — never last period and never a rolling mean. The
      declared expectation has two shapes, which is what the fixed/variable split is for. A FIXED cost
      (rent, insurance, a licence, a subscription) expects a contracted AMOUNT, and any difference past its
      tolerance is news in either direction: a rent 200 AED low is a credit to chase exactly as a rent 200
      AED high is a query. A VARIABLE cost (the utility recharge, laundry by volume, card fees) moves by
      design, so one expected number would be wrong every month by construction; it expects a declared
      BAND and its variance is the distance OUTSIDE the band — zero while the bill is inside it, which is
      what stops an August electricity bill alerting every summer. Both alternatives were rejected for
      specific reasons. Against LAST PERIOD: the second month of a wrong amount is silent, because the
      landlord who overcharges the identical amount twice produces a zero difference on the second — and a
      wrong figure that persists is the one most worth catching. Against a ROLLING MEAN: the mean absorbs
      the error it exists to detect (three months of an incorrect rent pulls the mean onto it), and on a
      seasonal cost it fires on the way up and again on the way down, both of which are normal. The
      tolerance is basis points of the BREACHED expectation — the contracted amount, or whichever band edge
      was crossed — so one declared number means one thing while the two shapes keep their two
      expectations. It is NOT NULL with NO DEFAULT, like supplier_tax_profile.residency: zero would make
      every variable cost alert on the first fils outside its band and 500 would accept a 5% rent rise for
      ever, and a default makes "nobody chose" indistinguishable from a choice. Strictly greater than the
      tolerance is over it, so a bill exactly ON the tolerance is within — the off-by-one there alerts on
      every cost whose tolerance was set to the amount it actually varies by.'
    - 'NOTE: the expectation is SNAPSHOTTED onto each period by recurring_cost_instance rather than read
      through the definition, which is why five columns appear twice. A rent renegotiated in June must not
      retroactively change what March''s variance report said, in either direction. Same mechanism and same
      argument as bill.supplier_trn in 0028.'
    - 'NOTE: "period" in the 12-period forward schedule is read as a MONTH OF THE HORIZON, not an
      occurrence of the cost. It is the only reading under which cadences can be summed: a quarterly
      insurance premium and a monthly rent both land in the month they fall due, so one cash-flow line adds
      up. The window is half-open, [as_of, as_of + 12 months), which makes a monthly cost contribute exactly
      twelve occurrences whatever day of the month it falls on — bounding it on calendar months instead
      gives eleven for a cost due on the 1st and twelve for one due on the 20th, purely because of when the
      report was run. Twelve rolling months from 18 September therefore touch THIRTEEN calendar month keys,
      the first and last partial, which the committed worked example states explicitly.'
    - 'NOTE: "queryable by R-REP without touching the cost tables directly" is
      recurring_cost_forward_schedule(as_of, months), a SQL set-returning function, wrapped by
      packages/db/src/queries/recurring-cost-forecast.ts. It computes the occurrences from the DEFINITIONS
      and deliberately does not read recurring_cost_instance: a forecast that joined the generated periods
      would end wherever the nightly pass last got to, and a horizon that quietly shortens looks exactly
      like a business with no costs in month eleven. The same function is what generateRecurringInstances
      enumerates, so a period can never be forecast but not generated (and therefore never able to raise a
      missing-cost alert) or generated but not forecast (a cash-flow line short by one rent).'
    - 'NOTE: NO RECURRING COST IS SEEDED, in the migration or by the fixture loader, and that is the
      decision rather than an omission. The real register — landlord, utilities, laundry, consumables,
      licence, insurance — is an H-MIG import, exactly as the domestic supplier list is (0028 makes the same
      call). A recurring cost carries an AMOUNT, so a placeholder contract would be summed into a cash-flow
      forecast and then believed; the empty register is the strictest safe option and it needs no
      is_placeholder_text marker because there is no provisional value in the schema at all. Logged as
      Y11-recurring-costs in docs/OPEN-QUESTIONS.md, blocking the register''s contents and R-REP''s
      forecast. The five offshore vendors 0028 seeds as suppliers are not registered as costs either: what
      any of them actually bills per month is unknown, and guessing is how a forecast acquires a number
      nobody chose. The committed fixtures in packages/fixtures/src/recurring-costs.ts are test data,
      carry the FIXTURE supplier prefix, and are loaded by no seed.'
    - 'NOTE: AUTOMATIC MATCHING IS DELIBERATELY ABSENT. The nightly pass generates periods and raises
      alerts; it never guesses which invoice satisfies which period. A landlord bills rent AND a service
      charge, so "the other invoice from this supplier" is not a unique answer, and one wrong attachment
      reports a false variance, silences a real missing-cost alert and leaves another cost looking unbilled
      — three wrong answers from one row. Matching is recorded where the knowledge is: postRecurringBill
      records it as the bill is entered (through postBill, so there is no second posting path), and
      matchBillToRecurringCost attaches one entered earlier. A rules-based matcher is available to a later
      unit as an addition, not a rewrite: it would call the same service. Also deliberately absent is any
      constraint tying the bill''s date to the period it satisfies — September''s utility bill is normally
      issued in October, and refusing that would refuse the ordinary case.'
    - 'NOTE: generation is bounded to twelve months BACK and twelve forward, not to each cost''s anchor. A
      contract anchored in 2019 and registered today would otherwise acquire seven years of unbilled
      periods and seven years of missing-cost alerts on the day it was entered — a burst nobody reads,
      which is the same failure as an alert that fires every month. Twelve months back is one full VAT
      year. generateRecurringInstances takes the window explicitly, so a caller that wants the full history
      asks for it.'
    - 'NOTE: a missing-cost alert fires when due_date < the business day, with no extra grace period. The
      grace is already in the definition — the DUE date is later than the supplier''s invoice date — rather
      than a second knob nobody would tune. A period due today is not late, exactly as a payable due today
      is "current" in 0028''s aging.'
    - 'NOTE: there is no acknowledged_at on recurring_cost_alert and the table is fully append-only (ADR
      0008/0017). An alert row is the evidence that something was noticed on a date, and that fact does not
      change; an inbox that tracks what has been dealt with is a different table and a later unit''s
      decision, and a mutable column here would make the row rewritable by whatever owns that inbox.'
    - 'NOTE: the nightly pass takes its business day from business_day (the materialised trading calendar,
      generated from the same rule resolveTradingDate states) and THROWS when the calendar holds nothing at
      or before the instant, rather than falling back to a calendar date. Trading runs 11:00-02:00, so the
      03:45 cron belongs to the session that opened the previous morning; a truncated timestamp would date
      every alert a day late and, at a month boundary, into a period already filed.'
    - 'NOTE: five files outside this unit changed. apps/worker/src/registry.ts gains the
      recurring-cost.check cron (pnpm jobs fails a cron declared anywhere else, and one with no agent);
      0031 seeds the recurring_cost_register agent_definition AND its agent_heartbeat row, because
      agentsWithHeartbeat INNER joins and an agent with no heartbeat is one the watchdog silently never
      checks; and packages/core/src/index.ts, packages/db/src/index.ts and packages/fixtures/src/index.ts
      each gain one export line. scripts/test-gates.mjs gains the 26s block. The migration took 0031
      because 0030 and 0032 were held by units in flight.'
    - 'NOTE: the cadence stepper, the period key and the variance are each stated TWICE — in
      0031_recurring_cost.sql and in packages/core/src/money/recurring-schedule.ts — because packages/db
      may not import packages/core and the forecast has to group where the rows are. The two are asserted
      to agree over every cadence, thirty-seven occurrences of each, anchors on the 29th to 31st where the
      month-end clamp applies, and a sweep of amounts either side of both expectation shapes, in
      packages/fixtures/src/recurring-costs.itest.ts. That is the arrangement price_list/resolve-price.ts
      and payables_aging_bucket/payablesBucketFor already use, for the same reason and with the same
      agreement test.'
    files:
    - packages/db/migrations/0031_recurring_cost.sql
    - packages/db/src/schema/recurring-cost.ts
    - packages/db/src/services/recurring-cost.ts
    - packages/db/src/services/recurring-cost.itest.ts
    - packages/db/src/queries/recurring-cost-forecast.ts
    - packages/core/src/money/recurring-schedule.ts
    - packages/core/src/money/recurring-schedule.test.ts
    - packages/fixtures/src/recurring-costs.ts
    - packages/fixtures/src/recurring-costs.test.ts
    - packages/fixtures/src/recurring-costs.itest.ts
    - apps/worker/src/jobs/recurring-cost-check.ts
    - apps/worker/src/jobs/recurring-cost-check.itest.ts
    - apps/worker/src/registry.ts
    - scripts/test-gates.mjs
