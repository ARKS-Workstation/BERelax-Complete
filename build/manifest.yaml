  - id: G-REV-01
    order: 161
    title: 'Review data model: nullable google_review_id, delivery_mode as a column'
    summary: The two day-one data-model decisions from docs/10 SS6, made first so fallback mode is first-class
      rather than retrofitted. google_review_id is nullable because a pasted review has none; delivery_mode
      is a real column so submitted_at/confirmed_at and posted_manually_at coexist instead of overloading
      one posted_at. Includes the reconciliation path for when API access arrives.
    owner: claude
    status: done
    size: M
    depends_on:
    - G-CONN-01
    acceptance:
    - 'google_review_id is nullable: two reviews with NULL google_review_id insert successfully, and a partial
      unique index WHERE google_review_id IS NOT NULL rejects a duplicate non-null id — all three assertions
      in one test'
    - delivery_mode is NOT NULL with a CHECK constraint over api|manual, and a schema test asserts no column
      named posted_at exists on any review table (searching information_schema by name)
    - 'Mode fields coexist and are mutually exclusive per row: a manual delivery sets posted_manually_at
      with submitted_at NULL and an api delivery does the inverse; a CHECK constraint rejects a row that
      populates both, proven by a failed insert'
    - 'Star-only review: rating 5 with comment text NULL inserts successfully, because docs/10 SS7 records
      these as common and the generator must handle them'
    - 'Reconciliation in place: a manual review matched by reviewer name + rating + date backfills google_review_id
      on the existing row, and the test asserts the same row id, the unchanged draft text and the preserved
      delivery history rather than a new row'
    - 'At-least-once idempotency: replaying the same (google_review_id, update_time) payload twice yields
      exactly one review row and one audit_event'
    - source is constrained to api|email_parse|paste|manual and every review row carries the connection_id
      and placeId it belongs to, so a second connection cannot cross-contaminate the queue
    - 'NOTE: the migration is 0020_reviews.sql, not the 0043 guessed at above — 0016 is the highest applied and
      0017-0019 are reserved by units in flight, so 0020 is the next number reserved for this unit. SCHEMA_VERSION
      in packages/db/src/index.ts is 20. The table is google_reviews, in the google_* family of 0016'
    - 'NOTE: the schema assertions live in packages/db/src/schema/reviews.itest.ts, not a .test.ts, for the same
      reason as G-CONN-01 — every one of them is a claim about a real PostgreSQL (information_schema,
      pg_constraint, pg_indexes, and an insert that must be refused), and a unit test could only assert against a
      mock of it. The repository behaviour test is packages/google/src/review-queue.itest.ts: it needs both
      @berelax/db and REVIEW_FIXTURES from @berelax/providers/google (the subpath, never the barrel), and
      packages/google is the package that already depends on both. packages/db depends on @berelax/shared only and
      a test is not a licence to widen that'
    - 'NOTE: delivery_mode carries three timestamps rather than two — submitted_at and confirmed_at for the API,
      because Google acknowledges separately from the submission, and posted_manually_at for a human. One check
      constraint makes them mutually exclusive per row, and its `else false` arm means a third delivery mode added
      later fails the constraint until somebody writes its rules rather than inheriting none. PostgreSQL promises
      no order over a row''s checks, so a bad delivery_mode may be reported by either that constraint or the enum
      check; the test accepts either name and asserts the row cannot be stored'
    - 'NOTE: reconciliation on reviewer name + rating + date is genuinely ambiguous, so reconcileApiReviewId
      returns an `ambiguous` outcome with the candidate ids and writes nothing rather than guessing. Two star-only
      four-star reviews from ''A Google user'' on one day is an ordinary Saturday — REVIEW_FIXTURES carries
      exactly that reviewer twice — and a wrong backfill would move the google_review_id, and every later API
      reply, onto another review''s draft with nothing downstream able to notice. The date is matched in an IANA
      zone passed as an argument: rev-1-star-only''s 2026-09-15T23:58Z is 2026-09-16 in Asia/Dubai, which is the
      date Google shows the owner, and matching on the UTC date misses every review left after 20:00 local'
    - 'NOTE: the ''preserved delivery history'' the reconciliation test asserts is delivery_mode plus its
      timestamps on the row itself, and the audit_event trail (google_review.recorded, .ingested, .reconciled,
      .reply_posted_manually). There is deliberately no second append-only review_event table: audit_event already
      carries the per-action trail, and a second log for one entity would need its own mirror to stay consistent
      with it'
    - 'NOTE: cross-contamination is prevented by a trigger, not only by carrying the two columns.
      google_reviews_place_belongs_to_connection refuses a place_id that is not a gbp_reviews
      resource_ref->>''placeId'' of that connection, on insert and on an update of either column, because a row is
      already wrong by the time any queue filter runs. Two consequences for later units: a review insert requires
      that capability row to exist (health ''permission_missing'' is fine, which is the launch-day state), and the
      connection foreign key is ON DELETE RESTRICT, so a test that clears google_connections must clear
      google_reviews first'
    - 'NOTE: a new gate rule review-no-overloaded-posted-at in scripts/check-schema-conventions.mjs fails a
      migration that puts posted_at on a table whose name contains ''review'', with a known-bad fixture and an
      allowed-elsewhere control in scripts/test-gates.mjs (cases 27/28). The information_schema assertion required
      by the acceptance line covers the applied schema; the gate covers the migration before it is applied
      anywhere'
    - 'NOTE deferred to G-REV-02: nothing calls this unit''s repository yet. The paste form, the defensive email
      parse, the Places count tripwire and the Monday nudge are G-REV-02, and the job that walks the API list and
      calls reconcileApiReviewId belongs with the unit that gets API access. This unit ships the shape, the
      constraints, ingestApiReview, recordManualReview, reconcileApiReviewId, the three delivery recorders and the
      connection-scoped queue read'
    - 'NOTE deferred to G-REV-03 and G-REV-04: reply_draft exists as a column here but nothing generates, lints or
      approves it (G-REV-04), and the routing verdict columns — matched rule id and lexicon version — belong to
      G-REV-03''s own migration. Adding either here would be a column no code writes'
    files:
    - packages/db/migrations/0043_reviews.sql
    - packages/db/src/schema/reviews.ts
    - packages/db/src/repositories/reviews.ts
    - packages/db/src/schema/reviews.schema.test.ts
