    acceptance:
    - '`pnpm --filter @berelax/web build` and `pnpm verify` pass with apps/web present, and `pnpm boundaries`
      reports a non-zero cruised-module count for apps/web (guards the ADR 0002 ''green tick on zero modules''
      failure)'
    - 'Generated CSS asserts `@theme inline { --color-*: initial }` and contains no Tailwind default palette
      variable (`--color-red-500`, `--color-slate-*` absent); a known-bad fixture using `class="bg-red-500"`
      is rejected by lint by rule name in scripts/test-gates.mjs and removed in a finally block'
    - 'A `no-untokened-colour` rule rejects any literal hex/rgb/oklch in a `color`, `border-color`, `fill`
      or `stroke` declaration under apps/web and packages/ui; fixture `color: #C08A43` is rejected by rule
      name, while `background: var(--decor-gold)` on a non-text element passes'
    - 'Playwright computed styles: `data-theme="light"` gives body background rgb(253,250,245); `data-theme="dark"`
      gives rgb(20,18,16); `prefers-color-scheme: dark` with no data-theme gives the dark ground; `data-theme="light"`
      under that media query stays light'
    - Rendered EN route head contains exactly two `<link rel="preload" as="font">`; network trace records
      zero requests to fonts.googleapis.com/fonts.gstatic.com and zero Arabic font files on an EN route;
      Latin woff2 total <=120KB and Arabic <=100KB on /ar
    - Every generated `@font-face` fallback declares size-adjust, ascent-override and descent-override (unit
      test parsing the emitted CSS), and a lint rule with a known-bad fixture rejects `var(--font-display)`
      used at any font-size below `lg`
    - On /ar, computed styles show letter-spacing 0, text-transform none, --font-size-scalar 1.06 and body
      line-height >=1.85
    - 'NOTE: the body face ships as the variable cut (@fontsource-variable/ibm-plex-sans, 45.7KB, wght
      100-700) rather than the static 400 + 600 pair. next/font/local preloads every file in a src array,
      so ''exactly two preloads'' requires the body face to be one file; the variable cut is 1.2KB smaller
      in total across one request instead of two, and makes font-weight 500 a real weight rather than a
      synthesised one.'
    - 'NOTE: the Arabic face ships the 500 and 600 cuts, not 400 and 600. theme/arabic.css sets Arabic body
      copy to weight 500, and with 400 shipped CSS weight matching resolved 500 downwards to 400 — the
      recalibration silently did nothing and the 42KB 400 file was the only one ever drawn. /ar now totals
      91KB of Arabic, under the 100KB budget, asserted from the wire.'
    - 'NOTE: two root layouts, app/(en)/layout.tsx and app/(ar)/layout.tsx, sharing app/_document/shell.tsx.
      The (public) group moved under (en). An earlier draft set lang/dir on a <main> wrapper inside one
      English root layout: it built, rendered mirrored text, and did none of the four things
      theme/arabic.css exists to do, because every rule there is inherited from the document element. The
      (admin) and (payload) groups are W-SITE/W-SYS-08''s; only the locale split is here.'
    - 'NOTE: the type scale is mapped onto Tailwind''s --text-* namespace in globals.css with
      --text-*: initial first, because Tailwind''s own ramp starts at 16px and ours at 17px. Pinned to
